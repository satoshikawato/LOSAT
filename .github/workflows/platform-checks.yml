name: Platform checks

# LOSAT on Linux x64, Linux arm64, Windows x64, macOS arm64 and macOS x64, with the performance
# switches on (the default, LOSAT/src/utils/xswitch.rs) and off (LOSAT_X_DEFAULT=0, the reference
# paths):
#  - outputs: release binary, 49 cases (all five programs) at 1 and 4 threads in both modes; the
#    outputs of the two modes must be byte-identical and the exit codes 0 (LOSAT/tests/platform_checks.py);
#    on Linux arm64 the release binary also passes the floating-point contract check
#    (LOSAT/tests/check_fp_contract.py binary; ci.yml checks the Linux x64 binary);
#    on the two arm64 platforms two more modes, LOSAT_X_DPNEON=0 (the other switches on, the scalar
#    X-drop instead of the NEON kernels the default runs) and LOSAT_X_DPNEON2=1 (the NEON kernels in
#    register pairs, off unless set), must give the same outputs as well;
#  - compare: the hashes of the platforms of the run must equal each other (no expected hash is
#    stored; the frozen hashes are checked on Linux x64 by ci.yml);
#  - tests: cargo test --all-features (cargo-nextest) in both modes, built once per platform, on the
#    platforms other than Linux x64 (ci.yml runs both modes on Linux x64); the reference mode leaves
#    out the test files whose runs set every LOSAT_* variable themselves
#    (LOSAT/tests/reference_step_targets.sh).
#
# Two sets of platforms (job `changes` chooses):
#  - pull-request (a pull request into main, normally the promotion of dev): outputs on Linux
#    x64, Linux arm64, Windows x64 and macOS arm64; tests on Linux arm64 and Windows x64. One
#    macOS job per pull request: GitHub runs five macOS jobs at a time for the whole account,
#    and the macOS jobs were the queue (2026-10-16: six per pull request, three to four hours of
#    runner time each).
#  - full (push to main, the weekly schedule, workflow_dispatch): the pull-request set plus
#    outputs on macOS x64 and tests on macOS arm64 and macOS x64.
# Pull requests always start the workflow (so that `platform checks result` exists and can be
# required), but its jobs run only when the engine, the Cargo files or this workflow's own files
# change and the pull request is not a draft (a draft runs them when it is marked ready for
# review). A pull request into the integration branch dev runs no platform job (its
# `platform checks result` passes); the promotion pull request from dev to main runs them once
# for the batch. A push to main runs the full set when those files changed; its runs do not
# cancel each other, so at most one runs and one waits (the newest), and every run of main
# completes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'LOSAT/src/**'
      - 'LOSAT/Cargo.toml'
      - 'LOSAT/Cargo.lock'
      - 'LOSAT/build.rs'
      - '.github/workflows/platform-checks.yml'
      - 'LOSAT/tests/platform_checks.py'
      - 'LOSAT/tests/platform_check_cases.json'
      - 'LOSAT/tests/reference_step_targets.sh'
  schedule:
    - cron: '23 19 * * 0'
  workflow_dispatch:
    inputs:
      set:
        description: 'Platforms: full (five platforms) or pull-request (the set a pull request runs)'
        type: choice
        options: [full, pull-request]
        default: full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # One always-present gate for the required check: the `on.pull_request` trigger has no `paths:`
  # filter (a required check of a workflow that did not run would block the pull request forever),
  # so this job decides whether the pull request touches relevant files, and which set of
  # platforms the run uses.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      set: ${{ steps.filter.outputs.set }}
      outputs_matrix: ${{ steps.filter.outputs.outputs_matrix }}
      outputs_ids: ${{ steps.filter.outputs.outputs_ids }}
      tests_matrix: ${{ steps.filter.outputs.tests_matrix }}
    steps:
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_SET: ${{ github.event.inputs.set }}
        run: |
          set -euo pipefail
          # The platforms. `extra` adds the modes of the arm64 platforms (LOSAT_X_DPNEON=0: the scalar
          # X-drop with the other switches on; LOSAT_X_DPNEON2 is off unless set); the entries
          # without it run the two standard modes.
          neon='--extra-mode noneon=LOSAT_X_DPNEON=0 --extra-mode dpneon2=LOSAT_X_DPNEON2=1'
          o_linux_x64='{"runner":"ubuntu-24.04","id":"linux-x64","python":"python3"}'
          o_linux_arm64='{"runner":"ubuntu-24.04-arm","id":"linux-arm64","python":"python3","extra":"'"$neon"'"}'
          o_windows_x64='{"runner":"windows-2025","id":"windows-x64","python":"python"}'
          o_macos_arm64='{"runner":"macos-15","id":"macos-arm64","python":"python3","extra":"'"$neon"'"}'
          o_macos_x64='{"runner":"macos-15-intel","id":"macos-x64","python":"python3"}'
          t_linux_arm64='{"runner":"ubuntu-24.04-arm","id":"linux-arm64"}'
          t_windows_x64='{"runner":"windows-2025","id":"windows-x64"}'
          t_macos_arm64='{"runner":"macos-15","id":"macos-arm64"}'
          t_macos_x64='{"runner":"macos-15-intel","id":"macos-x64"}'

          set_name=full
          if [ "$EVENT_NAME" = pull_request ]; then set_name=pull-request; fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT_SET" ]; then set_name=$INPUT_SET; fi
          case "$set_name" in
            pull-request)
              outputs="[$o_linux_x64,$o_linux_arm64,$o_windows_x64,$o_macos_arm64]"
              tests="[$t_linux_arm64,$t_windows_x64]"
              ;;
            full)
              outputs="[$o_linux_x64,$o_linux_arm64,$o_windows_x64,$o_macos_arm64,$o_macos_x64]"
              tests="[$t_linux_arm64,$t_windows_x64,$t_macos_arm64,$t_macos_x64]"
              ;;
            *)
              echo "unknown set '$set_name'" >&2
              exit 1
              ;;
          esac
          ids=$(python3 -c 'import json, sys; print(" ".join(e["id"] for e in json.loads(sys.argv[1])))' "$outputs")

          relevant=true
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$BASE_REF" = dev ]; then
              echo "Pull request into dev: the platform jobs run on the promotion to main."
              relevant=false
            elif [ "$PR_DRAFT" = true ]; then
              echo "Draft pull request: the platform jobs run when it is marked ready for review."
              relevant=false
            else
              # Pattern = the former `pull_request: paths:` list (the `on.push.paths` list above), as
              # anchored extended regular expressions (`**` = .*, `*` = [^/]*).
              pattern='^(LOSAT/src/.*|LOSAT/Cargo\.toml|LOSAT/Cargo\.lock|LOSAT/build\.rs|\.github/workflows/platform-checks\.yml|LOSAT/tests/platform_checks\.py|LOSAT/tests/platform_check_cases\.json|LOSAT/tests/reference_step_targets\.sh)$'
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" -q '.[].filename')
              echo "Changed files:"
              printf '%s\n' "$files"
              if grep -Eq "$pattern" <<< "$files"; then
                relevant=true
              else
                echo "No relevant file changed: the platform jobs are skipped."
                relevant=false
              fi
            fi
          fi

          echo "set=$set_name relevant=$relevant"
          echo "outputs: $ids"
          echo "tests: $(python3 -c 'import json, sys; print(" ".join(e["id"] for e in json.loads(sys.argv[1])))' "$tests")"
          {
            echo "relevant=$relevant"
            echo "set=$set_name"
            echo "outputs_matrix=$outputs"
            echo "outputs_ids=$ids"
            echo "tests_matrix=$tests"
          } >> "$GITHUB_OUTPUT"

  outputs:
    name: default = LOSAT_X_DEFAULT=0 (${{ matrix.id }})
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.outputs_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # Fixtures are compared byte for byte; keep Git for Windows from turning them into CRLF.
      - name: Check out without line-ending conversion
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LOSAT -> target
          key: outputs-${{ matrix.id }}
      - name: Build release binary
        run: cd LOSAT && cargo build --release --locked --bin losat
      # NCBI reference (598d8ae6): c++/src/algo/blast/core/boost_erf.c:143-143
      # result *= expl(-z * z) / z;
      # LOSAT's one mul_add emulates that long-double line; no other function of the release binary
      # may hold an FMA instruction or a call of fma (docs/agents/diagnostics.md, "Floating-point
      # contract"). The runner's GNU objdump reads aarch64.
      - name: Floating-point contract (release binary)
        if: matrix.id == 'linux-arm64'
        run: mkdir -p platform-check && python3 LOSAT/tests/check_fp_contract.py binary --losat LOSAT/target/release/losat --out platform-check/fp-contract.txt
      - name: Default against LOSAT_X_DEFAULT=0, 49 cases, 1 and 4 threads
        run: ${{ matrix.python }} LOSAT/tests/platform_checks.py run --losat LOSAT/target/release/losat --out platform-check ${{ matrix.extra }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-checks-${{ matrix.id }}
          path: |
            platform-check/rows.tsv
            platform-check/fp-contract.txt
          if-no-files-found: error
          retention-days: 30

  compare:
    name: same hashes on all platforms
    needs: [changes, outputs]
    if: ${{ !cancelled() && needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-checks-*
          path: tables
      - name: Compare the tables of the platforms of this run
        env:
          IDS: ${{ needs.changes.outputs.outputs_ids }}
        run: |
          set -euo pipefail
          args=()
          for id in $IDS; do
            args+=(--table "$id=tables/platform-checks-$id/rows.tsv")
          done
          python3 LOSAT/tests/platform_checks.py compare "${args[@]}"

  tests:
    name: cargo test, default and reference (${{ matrix.id }})
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.tests_matrix) }}
    runs-on: ${{ matrix.runner }}
    # Two full cargo test runs in debug. On Windows x64 the default run took 49 min and the
    # reference run did not finish within the former 90 min (2026-10-17, dev with the eight blastp
    # default switches: their integration tests take 2-6 min each there). On 2026-10-18 the job
    # took 82-130 min, and on macOS x64 it hit this limit; since then the reference run leaves out
    # the files that would repeat the default run (90 % of its time on Linux x64, 2026-10-21).
    timeout-minutes: 150
    env:
      # Optimized test code; the test profile keeps the dev profile's debug assertions and
      # overflow checks (as in ci.yml). Set for the job, so that rust-cache's key keeps the
      # dependencies built at this level.
      CARGO_PROFILE_TEST_OPT_LEVEL: '3'
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Check out without line-ending conversion
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LOSAT -> target
          key: tests-${{ matrix.id }}
      # cargo-nextest runs the tests of all test binaries together (cargo test runs one binary at
      # a time), as in ci.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # The switches are read at run time (LOSAT/src/utils/xswitch.rs), so one build serves both
      # modes; the second step runs the test binaries the first one built.
      - name: cargo nextest run --all-features, default
        run: |
          cd LOSAT
          cargo nextest run --locked --all-features --no-fail-fast
          cargo test --locked --all-features --doc
        env:
          LOSAT_BLASTX_WORKER_LOG: ${{ runner.temp }}/blastx-worker.log
      # Without the test files marked "CI reference step: skipped": each of their runs sets its own
      # LOSAT_* variables, so it would repeat the default step (LOSAT/tests/reference_step_targets.sh).
      - name: cargo nextest run --all-features, reference (LOSAT_X_DEFAULT=0)
        if: ${{ !cancelled() }}
        run: |
          cd LOSAT
          targets=$(bash tests/reference_step_targets.sh)
          cargo nextest run --locked --all-features --no-fail-fast $targets
        env:
          LOSAT_X_DEFAULT: '0'
          LOSAT_BLASTX_WORKER_LOG: ${{ runner.temp }}/blastx-worker.log

  # The check to require in the ruleset: it always runs and fails only if a job failed or was
  # cancelled (jobs skipped because no relevant file changed, or because the pull request is a
  # draft, count as passed).
  result:
    name: platform checks result
    if: always()
    needs: [changes, outputs, compare, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "A job did not succeed." >&2
              exit 1
            fi
          done
