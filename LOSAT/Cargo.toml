[package]
name = "LOSAT"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
autotests = false
description = "Pure-Rust local BLAST that matches NCBI BLAST+ on LOSAT's test fixtures, with genetic-code exceptions and command-WASI support"
license = "MIT"
repository = "https://github.com/satoshikawato/LOSAT"
readme = "../README.md"
keywords = ["blast", "bioinformatics", "alignment", "wasm", "genomics"]
categories = ["science::bioinformatics", "command-line-utilities"]
exclude = [
    ".tmp/",
    "tests/",
    "losat_out/",
    "**/*.pyc",
    "**/*.tmp",
    "**/*.orig",
    "/matrix",
]

[lib]
crate-type = ["rlib", "cdylib"]

# The command is `losat` (`losat.exe`, `losat.wasm`); the package and the library crate stay `LOSAT`.
[[bin]]
name = "losat"
path = "src/main.rs"

# The files of tests/ are modules of six suite binaries (tests/suites/<name>.rs, one `#[path]` module per
# file) instead of one binary each; the two files that change the process environment or
# process-wide state (the counting global allocator of thread_memory) stay alone. Unit tests live in
# the crate, next to the code they test (`#[cfg(test)]`).
# tests/suite_layout.rs checks that every file is in exactly one test binary.
[[test]]
name = "blastn"
path = "tests/suites/blastn.rs"

[[test]]
name = "blastp"
path = "tests/suites/blastp.rs"

[[test]]
name = "blastx"
path = "tests/suites/blastx.rs"

[[test]]
name = "tblastn"
path = "tests/suites/tblastn.rs"

[[test]]
name = "tblastx"
path = "tests/suites/tblastx.rs"

[[test]]
name = "common"
path = "tests/suites/common.rs"

[[test]]
name = "blastn_report_stream_api"
path = "tests/blastn_report_stream_api.rs"

[[test]]
name = "thread_memory"
path = "tests/thread_memory.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = { version = "1.11", optional = true }
indicatif = "0.18"
rustc-hash = "2.1"
# Compressed input (`-query`, `-subject`, `makeblastdb -in` named `.gz`, `.bz2` or `.zst`), with
# pure-Rust decoders only, as the pure-Rust runtime boundary requires (no C library, no `links`
# metadata): flate2's miniz_oxide backend, bzip2's libbz2-rs-sys backend (not bzip2-sys), and
# ruzstd (a decoder; LOSAT never compresses). bzip2 0.6 builds libbz2-rs-sys by default; its `bzip2-sys`
# feature (the C library) is never enabled.
flate2 = "1.1"
bzip2 = "0.6"
ruzstd = "0.9"

# NCBI reference (598d8ae6): c++/include/corelib/ncbistre.hpp:437-440
# ```c++
# #else
# /// Portable alias for ifstream.
# typedef IO_PREFIX::ifstream      CNcbiIfstream;
# #endif
# ```
# NCBI reference (598d8ae6): c++/src/corelib/stream_utils.cpp:235-236
# ```c++
#     x_FillBuffer((size_t) m_Sb->in_avail());
#     return gptr() < egptr() ? CT_TO_INT_TYPE(*gptr()) : CT_EOF;
# ```
# NCBI reference (598d8ae6): c++/src/util/lmdb/mdb.c:395,3969
# ```c
# #define	GET_PAGESIZE(x)	((x) = sysconf(_SC_PAGE_SIZE))
# 	GET_PAGESIZE(e->me_os_psize);
# ```
# Rust system calls for the native readable-byte hint (`io`), and for the page size
# of the LMDB files of version 5 (`writedb::platform::host_page_size`): `param`
# (rustix's `sysconf(_SC_PAGESIZE)` on macOS and the BSDs) and `mm` (the kernel's
# alignment through `mmap` and `mprotect` on Linux, which needs neither /proc nor
# the C library), and the read-only mappings of the RPS-BLAST profile files
# (`utils::mapped_file`, as NCBI's `CMemoryFile`), and `fs` for the write-permission
# test of makeblastdb's output directory (`access`, which NCBI's `euidaccess` calls,
# `writedb::build_db::check_access_write`). No BLAST behavior, foreign algorithm, NCBI runtime/build
# dependency or libc-auxv feature (the pure-Rust runtime boundary,
# tests/check_pure_rust_runtime_boundary.py, allows no direct libc call). A caret requirement
# like every other dependency: Cargo.lock fixes the exact version for every build from this
# repository (CI and the release with --locked), and Dependabot moves it.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "param", "mm", "fs"] }

# Windows file-handle type (`GetFileType`, `GetConsoleMode`) for the stream-position test of
# `IsIStreamEmpty` (`input_files::has_stream_position`), and the read-only file mappings of the
# RPS-BLAST profile files (`utils::mapped_file`: `CreateFileMappingW`, whose signature names
# `SECURITY_ATTRIBUTES`, and `MapViewOfFile`); only the features those need.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[features]
default = ["parallel"]
# EXPERIMENT: work counters (off by default so they cost nothing)
xstats = []
# Diagnostic-only: the trace, debug, dump and profile variables that no test, script or CI step
# sets (`utils/xdiag.rs`, docs/agents/diagnostics.md "Diagnostic build"). A build without it ignores
# them and says so on stderr. No NCBI counterpart.
diagnostics = []
parallel = ["rayon"]
# NCBI reference: ncbi-blast/c++/src/algo/blast/blastinput/blast_args.cpp:3205-3222
# ```c
# int num_threads = args[kArgNumThreads].AsInteger();
# if (num_threads > kMaxValue) {
#     m_NumThreads = kMaxValue;
# } else {
#     m_NumThreads = num_threads;
# }
# ```
#
# Standard WASI aliases and packaging select this feature together with the
# wasm32-wasip1-threads target and a runtime that implements thread spawning.
# Explicit wasm32-wasip1 and wasm32-unknown-unknown builds remain serial.
wasm-threads = ["parallel"]
# NCBI reference (598d8ae6): c++/src/algo/blast/core/blast_engine.c:1659-1664
# ```c++
#     /* Use a local diagnostics structure, because the one passed in an input
#       argument can be shared between multiple threads, so we don't want to pass
#       it to the engine and have a lot of mutex contention. */
#     BlastDiagnostics* local_diagnostics = Blast_DiagnosticsInit();
#
#     if ((status =
# ```
# Diagnostic-only host clock/worker identity; never read by search or reporting.
blastx-worker-probe = []
# Diagnostic-only parity switch. NCBI BLAST has a single scalar C control flow
# for TBLASTX ungapped extension/reevaluation (aa_ungapped.c:846-921,
# blast_hits.c:675-733); this feature forces the Wasm build to use the matching
# Rust scalar path even when the target enables simd128.
tblastx-wasm-scalar = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

# Optimized test code; the test profile keeps the dev profile's debug assertions
# and overflow checks. CI builds it at opt-level 3 with line tables only
# (CARGO_PROFILE_TEST_* in .github/workflows/ci.yml and platform-checks.yml): the
# tests ran 5 % faster than at level 1, and line tables cut the build by a fifth.
[profile.test]
opt-level = 1

# Lint levels of every target of the package (lib, bins, tests, examples).
# A lint is allowed here only with a reason. A single place that keeps a lint's shape on purpose
# uses `#[expect(lint, reason = "...")]` at that item instead of an entry here.

[lints.rust]
# The library crate is named LOSAT, the product's name (`use LOSAT::...` in web/adapter, examples
# and the binaries). Renaming the crate is the library line's decision.
non_snake_case = "allow"

[lints.clippy]
# NCBI's C functions are ported argument by argument (e.g. Blast_SemiGappedAlign,
# blast_gapalign.c), so a reviewer reads the Rust call next to the C one.
too_many_arguments = "allow"
# Per-thread and per-batch results are nested tuples and vectors that follow NCBI's structures.
type_complexity = "allow"
# Index loops address several arrays with one index, as NCBI's C does; iterators change the
# generated code of the lookup, scan and extension loops.
needless_range_loop = "allow"
explicit_counter_loop = "allow"
# NCBI's tables keep NCBI's digits so they diff against NCBI's source; each literal rounds to
# the same f64.
excessive_precision = "allow"
# The NCBI C/C++ snippets (AGENTS.md rule 4) are quoted with NCBI's own tabs.
tabs_in_doc_comments = "allow"
# Functions that take a list of ranges are given the whole span as one range.
single_range_in_vec_init = "allow"
