name: Web

on:
  push:
    paths:
      - 'web/**'
      - 'LOSAT/src/**'
      - 'LOSAT/build.rs'
      - 'LOSAT/Cargo.toml'
      - 'LOSAT/Cargo.lock'
      - 'LOSAT/.cargo/**'
      - 'LOSAT/tests/wasi_*.js'
      - 'LOSAT/tests/outfmt0_manifest.tsv'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'LOSAT/src/**'
      - 'LOSAT/build.rs'
      - 'LOSAT/Cargo.toml'
      - 'LOSAT/Cargo.lock'
      - 'LOSAT/.cargo/**'
      - 'LOSAT/tests/wasi_*.js'
      - 'LOSAT/tests/outfmt0_manifest.tsv'
      - '.github/workflows/web.yml'

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/app/test-results/
          retention-days: 7

  # The web API tests compile only for wasm32, so the native `cargo test` in ci.yml
  # never runs them. Run them on wasm32-wasip1 under Node's WASI.
  engine-web-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Web API v1 tests on wasm32-wasip1
        working-directory: LOSAT
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/web/tools/wasi-test-runner.mjs
        run: cargo test --locked --lib --target wasm32-wasip1 --no-default-features -- web_api::tests

  # The engine adapter (web/adapter): build identity with the certified engine builds
  # (plan TD-6), the index-scan property tests (TD-8), the two reactors, and V-ABI:
  # every supported format of every program through ABI v2, compared with the native
  # CLI of the same commit (plan §6.2).
  adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1, wasm32-wasip1-threads
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build identity (plan TD-6)
        run: python3 web/adapter/tools/check_build_identity.py
      - name: Adapter tests
        working-directory: web/adapter
        run: cargo test --locked
      - name: Native LOSAT, the V-ABI expectation
        working-directory: LOSAT
        run: cargo build --release --locked
      - name: Reactors
        run: python3 web/adapter/tools/build_reactors.py --target-dir ${{ runner.temp }}/adapter-target --output-dir ${{ runner.temp }}/reactors
      - name: V-ABI (quick suite)
        run: |
          python3 web/adapter/tools/v_abi_cases.py --suite quick --out ${{ runner.temp }}/v-abi-cases.json
          node web/adapter/tests/v_abi.js --native LOSAT/target/release/LOSAT \
            --serial ${{ runner.temp }}/reactors/losat-web-serial.wasm \
            --threads ${{ runner.temp }}/reactors/losat-web-threads.wasm \
            --cases ${{ runner.temp }}/v-abi-cases.json
      - name: Keep the reactors for the browser job
        uses: actions/upload-artifact@v4
        with:
          name: reactors
          path: |
            ${{ runner.temp }}/reactors/artifacts.json
            ${{ runner.temp }}/reactors/losat-web-serial.wasm
            ${{ runner.temp }}/reactors/losat-web-threads.wasm
          retention-days: 3
      - name: Keep the native CLI for the browser job
        uses: actions/upload-artifact@v4
        with:
          name: native
          path: LOSAT/target/release/LOSAT
          retention-days: 3

  # V-BR (plan §6.2): the application's EngineGateway and Engine worker with the reactors
  # of the adapter job, in Chromium, Firefox and WebKit, compared with the native CLI of the
  # same commit and NCBI's frozen bytes (tests/e2e/engine.spec.ts); the other E2E tests on
  # the application built with the engine; and the reactor tests in Node (the RecordScanner
  # contract on the serial reactor, responses of more than 1 MiB).
  browser-engine:
    needs: adapter
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: reactors
          path: ${{ runner.temp }}/reactors
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: ${{ runner.temp }}/native
      - run: chmod +x ${{ runner.temp }}/native/LOSAT
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: RecordScanner contract on the serial reactor (Node)
        env:
          LOSAT_WEB_REACTORS: ${{ runner.temp }}/reactors
        run: npx vitest run tests/unit/engine-runtime.test.ts
      - name: V-BR and every E2E test with the engine in the build
        env:
          LOSAT_WEB_REACTORS: ${{ runner.temp }}/reactors
          LOSAT_WEB_NATIVE: ${{ runner.temp }}/native/LOSAT
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-engine-results
          path: web/app/test-results/
          retention-days: 7
