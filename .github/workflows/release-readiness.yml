name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA to check out and certify
        required: true
        type: string
      run_integrated_certification:
        description: Run the full 43-native/41-serial-Wasm certification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality And Package Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.1

      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"

      - name: Capture build metadata
        run: |
          mkdir -p .tmp/release-readiness/quality
          git rev-parse HEAD > .tmp/release-readiness/quality/git-commit.txt
          rustc --version > .tmp/release-readiness/quality/rust-version.txt
          rustc -vV > .tmp/release-readiness/quality/rust-version-verbose.txt
          cargo --version > .tmp/release-readiness/quality/cargo-version.txt

      - name: Format
        run: cd LOSAT && cargo fmt --check

      - name: Clippy
        run: cd LOSAT && cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cd LOSAT && cargo test --all-features --locked

      - name: Runtime boundary and integrated-driver tests
        run: |
          python LOSAT/tests/check_pure_rust_runtime_boundary.py
          python -m unittest LOSAT/tests/test_check_pure_rust_runtime_boundary.py
          python -m unittest LOSAT/tests/test_certify_integrated_runtime_v010.py

      - name: Native release build
        run: cd LOSAT && cargo build --release --locked

      - name: Serial Wasm build
        run: cd LOSAT && cargo build --release --target wasm32-wasip1 --no-default-features --locked

      - name: Package dry run
        run: |
          cd LOSAT
          cargo package --list > ../.tmp/release-readiness/quality/cargo-package-list.txt
          cargo publish --dry-run --locked \
            --config 'build.target-dir="/tmp/losat-cargo-publish-target"'

      - name: Capture artifact metadata
        run: |
          LOSAT/target/release/LOSAT --version > .tmp/release-readiness/quality/losat-version.txt
          sha256sum LOSAT/target/release/LOSAT > .tmp/release-readiness/quality/native-sha256.txt
          find LOSAT/target/wasm32-wasip1/release -maxdepth 2 -name '*.wasm' \
            -exec sha256sum {} \; > .tmp/release-readiness/quality/wasm-sha256.txt

      - name: Assemble release candidate artifacts
        run: |
          mkdir -p .tmp/release-readiness/artifacts
          host_triple="$(sed -n 's/^host: //p' .tmp/release-readiness/quality/rust-version-verbose.txt)"
          losat_version="$(awk '{ print $2 }' .tmp/release-readiness/quality/losat-version.txt)"
          native_name="LOSAT-${losat_version}-${host_triple}"
          cp LOSAT/target/release/LOSAT ".tmp/release-readiness/artifacts/${native_name}"
          chmod +x ".tmp/release-readiness/artifacts/${native_name}"
          tar -C .tmp/release-readiness/artifacts -czf \
            ".tmp/release-readiness/artifacts/${native_name}.tar.gz" \
            "${native_name}"
          for wasm_path in LOSAT/target/wasm32-wasip1/release/*.wasm; do
            wasm_name="$(basename "$wasm_path" .wasm)"
            cp "$wasm_path" \
              ".tmp/release-readiness/artifacts/${wasm_name}-${losat_version}-wasm32-wasip1.wasm"
          done
          sha256sum .tmp/release-readiness/artifacts/* \
            > .tmp/release-readiness/quality/release-artifacts-sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-quality
          path: .tmp/release-readiness/quality
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-artifacts
          path: .tmp/release-readiness/artifacts
          if-no-files-found: warn

  integrated-certification:
    name: Integrated Linux Native And Serial-Wasm Certification
    runs-on: [self-hosted, linux, x64, losat-certification]
    needs: quality
    if: ${{ inputs.run_integrated_certification }}
    env:
      EVIDENCE_DIR: /tmp/losat-integrated-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.1

      - name: Verify exact candidate and frozen official oracles
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          test -x /home/kawato/tools/ncbi-blast-oracle/ncbi-blast-2.17.0+/bin/blastn
          test -x /home/kawato/tools/ncbi-blast-oracle/ncbi-blast-2.17.0+/bin/blastp
          test -x /home/kawato/tools/ncbi-blast-oracle/ncbi-blast-2.17.0+/bin/tblastx
          test -f /home/kawato/tools/ncbi-blast-source/ncbi-blast-2.17.0+-src.tar.gz

      - name: Build exact native and serial-Wasm artifacts
        run: |
          cd LOSAT
          cargo build --release --locked
          cargo build --release --target wasm32-wasip1 --no-default-features --locked

      - name: Run full integrated certification
        run: |
          # NCBI references:
          # ncbi-blast/c++/src/algo/blast/format/blast_format.cpp:770-832
          # ncbi-blast/c++/src/objtools/align_format/format_flags.cpp:39-45
          # The committed program authorities classify raw NCBI/LOSAT output;
          # this workflow only invokes and archives that evidence.
          python LOSAT/tests/certify_integrated_runtime_v010.py \
            --expected-sha "${{ inputs.candidate_sha }}" \
            --output-dir "${EVIDENCE_DIR}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-runtime-certification-${{ inputs.candidate_sha }}
          path: /tmp/losat-integrated-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
