name: CI

# Pull requests run the fast checks (no NCBI executable); pushes run them on main
# and on the integration branch dev only. The two-hour WASI matrix and the full
# TBLASTX output set run in nightly.yml (schedule, workflow_dispatch) and in
# release-readiness.yml.
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks of `rust` other than cargo test; the tests run in `rust-tests`, and `rust` (the check
  # the rulesets require) passes when both jobs do.
  rust-lint:
    name: rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LOSAT -> target
      # NCBI reference: ncbi-blast/c++/src/algo/blast/core/blast_hits.c:1379-1381
      # calls qsort for HSP ordering. This fail-fast ratchet prevents LOSAT from
      # adding another project-owned native implementation boundary.
      - name: Pure-Rust runtime boundary
        run: python3 LOSAT/tests/check_pure_rust_runtime_boundary.py --root .
      - name: Pure-Rust boundary checker tests
        run: python3 -m unittest discover -s LOSAT/tests -p 'test_check_pure_rust_runtime_boundary.py'
      - name: Release-candidate tooling tests
        run: python3 -m unittest LOSAT/tests/test_prepare_release_candidate_v010.py
      - name: Release-candidate v0.2.0 tooling tests
        run: python3 -m unittest LOSAT/tests/test_prepare_release_candidate_v020.py LOSAT/tests/test_verify_release_archive_v020.py
      - name: Regression tooling tests
        run: python3 -m unittest discover -s LOSAT/tests -p 'test_ci_fast_regressions.py'
      # NCBI reference (598d8ae6): c++/src/algo/blast/core/boost_erf.c:143-143
      # result *= expl(-z * z) / z;
      # LOSAT's one mul_add emulates that long-double line; nothing else may fuse or
      # reassociate floating-point operations (docs/agents/diagnostics.md, "Floating-point contract").
      - name: Floating-point contract (sources and cargo configuration)
        run: python3 LOSAT/tests/check_fp_contract.py source
      - name: Floating-point contract checker tests
        run: python3 -m unittest discover -s LOSAT/tests -p 'test_check_fp_contract.py'
      # NCBI reference: ncbi-blast/c++/src/objtools/align_format/tabular.cpp:1098-1108
      # x_PrintField(*iter); m_Ostream << "\n";
      # The certification driver compares these raw bytes on Windows and macOS only
      # when dispatched; its tests also bind frozen_mismatch_allowlist.json to the
      # Gate A plan, so an entry that does not bind to the plan fails here first.
      - name: Platform certification driver tests
        run: python3 -m unittest discover -s LOSAT/tests -p 'test_certify_platform_native_v010.py'
      # NCBI reference (598d8ae6): c++/src/algo/blast/unit_tests/api/blasthits_unit_test.cpp:1094-1099
      # BOOST_AUTO_TEST_CASE(testHSPListSort). Ported NCBI unit-test cases are
      # cited above their Rust tests and counted in docs/evidence/ncbi_unit_cases.
      - name: NCBI unit-case ledger
        run: python3 LOSAT/tests/ncbi_unit_case_ledger.py check --root .
      - name: Ledger checker tests
        run: python3 -m unittest discover -s LOSAT/tests -p 'test_ncbi_unit_case_ledger.py'
      # No NCBI counterpart: release bookkeeping. Pending CHANGELOG entries are one file per pull
      # request (changelog.d/README.md), so two pull requests never conflict in CHANGELOG.md.
      - name: Changelog fragments
        run: python3 scripts/changelog_fragments.py check
      - run: cd LOSAT && cargo fmt --check
      - run: cd LOSAT && cargo clippy --all-targets --all-features -- -D warnings

  # cargo test --all-features in two shards on two runners (cargo-nextest, `--partition count:k/2`:
  # each test binary's tests in turn to the shards). Four vCPUs shaped like a runner's (two cores
  # and their hyperthreads) stayed busy: the tests of all binaries packed by nextest ran only 10 %
  # faster than cargo test's one binary at a time (2026-10-22); the blastp integration tests search
  # a proteome pair dozens of times each.
  rust-tests:
    name: cargo test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Optimized test code; the test profile keeps the dev profile's debug assertions and
      # overflow checks. Set for the job, so that rust-cache's key (it hashes the CARGO_*
      # variables it sees) keeps the dependencies built at this level.
      CARGO_PROFILE_TEST_OPT_LEVEL: '3'
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      # cache-on-failure: a red push run still saves the dependencies it built (the crate's
      # tests run after them), so that pull request shards do not build them cold until the
      # next green push run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LOSAT -> target
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - name: cargo nextest run --all-features
        run: cd LOSAT && cargo nextest run --all-features --no-fail-fast --partition count:${{ matrix.shard }}/2
        env:
          LOSAT_BLASTX_WORKER_LOG: ${{ runner.temp }}/blastx-worker.log
      # nextest runs no doc tests.
      - name: cargo test --all-features --doc
        if: matrix.shard == 1
        run: cd LOSAT && cargo test --all-features --doc

  # The check to require in the rulesets: it always runs and fails if a job above failed or was
  # cancelled.
  rust:
    name: rust
    if: always()
    needs: [rust-lint, rust-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "A job did not succeed." >&2
              exit 1
            fi
          done

  regressions:
    name: fast output regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select programs from the changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            python3 LOSAT/tests/ci_fast_regressions.py --select-only --changed-from "$BASE_SHA" | tee select.txt
          else
            python3 LOSAT/tests/ci_fast_regressions.py --select-only --programs all | tee select.txt
          fi
          echo "programs=$(sed -n 's/^selected programs: \([^ ]*\).*/\1/p' select.txt)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.select.outputs.programs != 'none'
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        if: steps.select.outputs.programs != 'none'
        with:
          workspaces: LOSAT -> target
      - name: Build release binary
        if: steps.select.outputs.programs != 'none'
        run: cd LOSAT && cargo build --release --locked --bin losat
      # FMA instructions and references to fma only where mul_add is (docs/agents/diagnostics.md,
      # "Floating-point contract").
      - name: Floating-point contract (release binary)
        if: steps.select.outputs.programs != 'none'
        run: python3 LOSAT/tests/check_fp_contract.py binary --losat LOSAT/target/release/losat
      # Frozen outfmt 0/7 bytes print the input paths of the runs that froze them
      # (TLOSAN Stage G); capture_outputs.py checks the bytes behind each path.
      - name: Link the frozen input paths
        if: steps.select.outputs.programs != 'none'
        run: |
          sudo mkdir -p /mnt/c/Users/genom/GitHub
          sudo ln -sfn "$GITHUB_WORKSPACE" /mnt/c/Users/genom/GitHub/LOSAT
      - name: Output hashes, frozen hashes and outfmt 0 fixtures
        if: steps.select.outputs.programs != 'none'
        # LOSAT_X_REACH (LOSAT/src/utils/xreach.rs): every run records which side its conditional
        # performance switches took; it changes no output.
        env:
          LOSAT_X_REACH: ${{ github.workspace }}/.tmp/switch-reach
        run: |
          python3 LOSAT/tests/ci_fast_regressions.py --losat LOSAT/target/release/losat \
            --out .tmp/fast-regressions --programs "${{ steps.select.outputs.programs }}"
      # Every side of a conditional switch that switch_reach_expected.tsv requires was taken by
      # some fixture above (a switch's own path and its reference path while it is on).
      - name: Conditional switches reached both sides
        if: steps.select.outputs.programs != 'none'
        run: |
          python3 LOSAT/tests/switch_reach_check.py --dir .tmp/switch-reach \
            --programs "${{ steps.select.outputs.programs }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.programs != 'none'
        with:
          name: fast-regressions
          path: |
            .tmp/fast-regressions/summary.json
            .tmp/fast-regressions/hashes.tsv
            .tmp/fast-regressions/timing.tsv
            .tmp/fast-regressions/outfmt0-fixtures-*.tsv
            .tmp/fast-regressions/*-regression-fixtures.tsv
          if-no-files-found: warn
          retention-days: 14
