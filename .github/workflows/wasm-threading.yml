name: WASI threading integration

# Runs the commit of the dispatch (or of the calling workflow). A non-blank candidate_sha is only checked
# against that commit (a dispatch of another commit's SHA fails before any build step); to run a
# candidate, dispatch on the branch whose head is the candidate.

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        default: ''
      include_serial_compatibility:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Candidate commit to assert (blank = no check; the run is the selected branch's head, which must equal it)
        type: string
        default: ''
      include_serial_compatibility:
        description: Also build and verify serial compatibility artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      INCLUDE_SERIAL_COMPATIBILITY: ${{ inputs.include_serial_compatibility }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A blank candidate_sha asserts nothing; a given one must be the commit that runs (the caller's
      # commit in a workflow_call).
      - name: Verify exact committed candidate SHA
        run: |
          if [[ -n "$CANDIDATE_SHA" && "$GITHUB_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "::error::candidate_sha is checked, not checked out: dispatch on the branch whose head is the candidate ($CANDIDATE_SHA); $GITHUB_REF is at $GITHUB_SHA"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: LOSAT -> target
      # NCBI reference (598d8ae6): c++/include/algo/blast/blastinput/blast_args.hpp:1290-1296
      - name: Install optional serial compatibility target
        if: ${{ inputs.include_serial_compatibility }}
        run: rustup target add wasm32-wasip1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install comparison test dependencies
        # Every package fixed by version and wheel hash: a run cannot pick up a new release, and a
        # changed file fails the install.
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r LOSAT/tests/requirements-wasm-threading.txt
      - name: Host and evidence parser tests
        run: |
          node --test LOSAT/tests/test_wasi_runners.js LOSAT/tests/test_wasi_shared_memory.js
          python3 -m unittest discover -s LOSAT/tests -p test_wasm_performance.py
          python3 -m unittest discover -s LOSAT/tests -p test_simple_comparison.py
      # NCBI reference (598d8ae6): c++/src/algo/blast/api/prelim_stage.cpp:145-188
      # Commands and CRT-initialized reactors have distinct artifacts and gates.
      - name: Build separate artifacts in both orders
        run: |
          cd LOSAT
          cargo build --release --locked --bin losat
          compat_args=()
          if [[ "$INCLUDE_SERIAL_COMPATIBILITY" == true ]]; then
            cargo build --release --locked --bin losat --no-default-features --target-dir target/native-serial
            compat_args=(--include-serial)
          fi
          cd ..
          python3 LOSAT/tests/build_wasi_artifacts.py --target-dir LOSAT/target --output-dir .tmp/threading/artifacts "${compat_args[@]}"
          python3 LOSAT/tests/build_wasi_artifacts.py --target-dir LOSAT/target --output-dir .tmp/threading/reverse-artifacts --reverse-order "${compat_args[@]}"
      # NCBI is a comparison oracle only. Verify the frozen official executable
      # identities before running searches; no production build invokes BLAST.
      - name: Install fixed comparison oracle
        id: oracle
        run: |
          mkdir -p .tmp/threading/oracle
          cd .tmp/threading/oracle
          curl --fail --location --retry 3 --output oracle.tar.gz 'https://ftp.ncbi.nlm.nih.gov/blast/executables/blast%2B/2.17.0/ncbi-blast-2.17.0%2B-x64-linux.tar.gz'
          tar -xzf oracle.tar.gz
          sha256sum oracle.tar.gz > archive.sha256
          cat > executables.sha256 <<'CHECKSUMS'
          33b64bc67d3149cee2459b2f7766b363323df632cf12c099546de00aea9698b5  ncbi-blast-2.17.0+/bin/blastn
          5ce267c04e4988c265357bfbedc64e809545b6fcfae7ff6775266fabbee8ba0e  ncbi-blast-2.17.0+/bin/blastp
          583e5d60bbd444ac455d20e0956c5aa0aeef675da8daee8204d8f9376ddb8804  ncbi-blast-2.17.0+/bin/tblastx
          fea14b77d4452a524a003196824f414812126bd3fb64d950feec8bacccf4976c  ncbi-blast-2.17.0+/bin/tblastn
          0dac09bed17043dfdf93ad71d50e6e177f273d5311897b9e653e45142bb3ef80  ncbi-blast-2.17.0+/bin/blastx
          CHECKSUMS
          sha256sum --check executables.sha256
      - name: Real command and reactor matrix
        run: |
          # NCBI reference (598d8ae6): c++/src/algo/blast/api/prelim_stage.cpp:173-180
          compat_args=()
          if [[ "$INCLUDE_SERIAL_COMPATIBILITY" == true ]]; then
            compat_args=(--native-serial LOSAT/target/native-serial/release/losat
              --serial .tmp/threading/artifacts/losat-serial-command.wasm
              --serial-reactor .tmp/threading/artifacts/losat-serial-reactor.wasm)
          fi
          python3 LOSAT/tests/check_wasm_threading.py \
            --native LOSAT/target/release/losat \
            --threaded .tmp/threading/artifacts/losat-threaded-command.wasm \
            --reactor .tmp/threading/artifacts/losat-threaded-reactor.wasm \
            --oracle-dir .tmp/threading/oracle/ncbi-blast-2.17.0+/bin \
            --output-dir .tmp/threading/gates "${compat_args[@]}"
      # threaded/tblastx/p11 took 3358 s of the 3600 s per-search limit in the last green
      # run (35201795582); hosted runners were 1.1-1.9x slower on the same binaries in
      # 36745543144 and 36882087513, where it timed out. A local A/B on the same cores
      # showed no slowdown of the threaded Wasm (E2g gate record), so the limit is doubled.
      - name: Frozen default and approved genetic-code regressions
        run: |
          # NCBI reference (598d8ae6): c++/src/algo/blast/api/prelim_stage.cpp:173-180
          compat_args=()
          if [[ "$INCLUDE_SERIAL_COMPATIBILITY" == true ]]; then
            compat_args=(--serial .tmp/threading/artifacts/losat-serial-command.wasm)
          fi
          python3 LOSAT/tests/check_wasm_threading_regressions.py \
            --native LOSAT/target/release/losat \
            --threaded .tmp/threading/artifacts/losat-threaded-command.wasm \
            --oracle-dir .tmp/threading/oracle/ncbi-blast-2.17.0+/bin \
            --jobs 3 --timeout-seconds 7200 \
            --output-dir .tmp/threading/frozen-regressions "${compat_args[@]}"
      # Runs after a failed frozen step too, so one run reports both.
      - name: TBLASTX thread-threshold regressions
        if: ${{ success() || failure() }}
        run: |
          compat_args=()
          if [[ "$INCLUDE_SERIAL_COMPATIBILITY" == true ]]; then
            compat_args=(--serial .tmp/threading/artifacts/losat-serial-command.wasm)
          fi
          python3 LOSAT/tests/check_tblastx_thread_thresholds.py \
            --native LOSAT/target/release/losat \
            --threaded .tmp/threading/artifacts/losat-threaded-command.wasm \
            --oracle .tmp/threading/oracle/ncbi-blast-2.17.0+/bin/tblastx \
            --output-dir .tmp/threading/threshold-regressions "${compat_args[@]}"
      # No NCBI counterpart: guards the benchmark runner's evidence rules (a run whose bytes do
      # not match is PARITY_FAIL, a bad command is FAIL, a stale output file is refused), so a
      # mismatching run is never timed. It runs last, so a failure of this test of a manual tool
      # cannot skip that night's engine gates.
      - name: Benchmark runner evidence test
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' }}
        run: |
          export BLASTN_BIN="$PWD/.tmp/threading/oracle/ncbi-blast-2.17.0+/bin/blastn"
          node LOSAT/tests/test_benchmark_wasi_reuse.js .tmp/threading/artifacts/losat-threaded-command.wasm threaded-command
          if [[ "$INCLUDE_SERIAL_COMPATIBILITY" == true ]]; then
            node LOSAT/tests/test_benchmark_wasi_reuse.js .tmp/threading/artifacts/losat-serial-command.wasm serial-command
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wasi-threading-evidence
          path: |
            .tmp/threading/artifacts
            .tmp/threading/reverse-artifacts
            .tmp/threading/gates
            .tmp/threading/frozen-regressions
            .tmp/threading/threshold-regressions
            .tmp/threading/oracle/*.sha256
          if-no-files-found: error
          retention-days: 30
