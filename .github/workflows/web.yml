name: Web

on:
  push:
    paths:
      - 'web/**'
      - 'LOSAT/src/**'
      - 'LOSAT/build.rs'
      - 'LOSAT/Cargo.toml'
      - 'LOSAT/Cargo.lock'
      - 'LOSAT/.cargo/**'
      - 'LOSAT/tests/wasi_*.js'
      - 'LOSAT/tests/outfmt0_manifest.tsv'
      - 'docs/assets/losat-logo*.svg'
      - '.github/workflows/web.yml'
  pull_request:

permissions:
  contents: read

jobs:
  # One always-present gate for the required check: the `on.pull_request` trigger has no `paths:`
  # filter (a required check of a workflow that did not run would block the pull request forever),
  # so this job decides whether the pull request touches relevant files. For a push to a branch
  # other than main it also checks whether an open pull request covers the branch: that pull
  # request's run checks the same commit, so the push run would build it a second time
  # (2026-10-16: 86 of 135 push runs on pull-request branches in 72 hours, 2,447 runner-minutes).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" != main ]; then
            prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$REPO_OWNER:$REF_NAME" -q '.[].number' | tr '\n' ' ')
            if [ -n "${prs// /}" ]; then
              echo "Open pull request(s) $prs cover branch $REF_NAME: the jobs run in the pull_request run."
              echo "relevant=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pattern = the former `pull_request: paths:` list, as anchored extended regular
          # expressions (`**` = .*, `*` = [^/]*):
          #   web/**
          #   LOSAT/src/**
          #   LOSAT/build.rs
          #   LOSAT/Cargo.toml
          #   LOSAT/Cargo.lock
          #   LOSAT/.cargo/**
          #   LOSAT/tests/wasi_*.js
          #   LOSAT/tests/outfmt0_manifest.tsv
          #   LOSAT/tests/fixtures/web_v1_*/** (the vectors of the Web API v1 tests)
          #   docs/assets/losat-logo*.svg (the README's logos; tests/unit/logo.test.ts reads them)
          #   .github/workflows/web.yml
          pattern='^(web/.*|LOSAT/src/.*|LOSAT/build\.rs|LOSAT/Cargo\.toml|LOSAT/Cargo\.lock|LOSAT/\.cargo/.*|LOSAT/tests/wasi_[^/]*\.js|LOSAT/tests/outfmt0_manifest\.tsv|LOSAT/tests/fixtures/web_v1_[^/]*/.*|docs/assets/losat-logo[^/]*\.svg|\.github/workflows/web\.yml)$'
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" -q '.[].filename')
          echo "Changed files:"
          printf '%s\n' "$files"
          if grep -Eq "$pattern" <<< "$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    # About three times the longest of 60 passing runs (13.6 min, 2026-11-11), as for the other
    # jobs here: a job that hangs (2026-11-11, below) gives its runner back.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run check
      # Usually 40 to 100 s. On 2026-11-11 the runners could not resolve the Ubuntu archive and apt
      # waited on every package, holding the job for hours; this step stops it instead.
      - run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: web/app/test-results/
          retention-days: 7

  # The web API tests compile only for wasm32, so the native `cargo test` in ci.yml
  # never runs them. Run them on wasm32-wasip1 under Node's WASI.
  engine-web-api:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Web API v1 tests on wasm32-wasip1
        working-directory: LOSAT
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/web/tools/wasi-test-runner.mjs
        run: cargo test --locked --lib --target wasm32-wasip1 --no-default-features -- web_api::tests

  # The engine adapter (web/adapter) over five jobs that run side by side: the build identity
  # with the certified engine builds (plan TD-6) and the index-scan property tests (TD-8) here;
  # the two reactors (`reactors`) and the native CLI of the same commit (`native`), each built
  # once on a runner of its own and kept as an artifact; V-ABI (`v-abi`): every supported format
  # of every program through ABI v2, compared with that CLI (plan §6.2); and V-BR
  # (`browser-engine`). Until 2026-11 the first four were steps of one job, 27 min in series,
  # and the browser job waited for all of them; each build is its own (the adapter tests in
  # web/adapter/target, the reactors in their own target directory, the CLI in LOSAT/target), so
  # nothing was shared between the steps.
  adapter:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1, wasm32-wasip1-threads
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build identity (plan TD-6)
        run: python3 web/adapter/tools/check_build_identity.py
      - name: Adapter tests
        working-directory: web/adapter
        run: cargo test --locked

  reactors:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1, wasm32-wasip1-threads
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # build_reactors.py runs the build identity check (plan TD-6) itself before it builds.
      - name: Reactors
        run: python3 web/adapter/tools/build_reactors.py --target-dir ${{ runner.temp }}/adapter-target --output-dir ${{ runner.temp }}/reactors
      - name: Keep the reactors for the V-ABI and browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reactors
          path: |
            ${{ runner.temp }}/reactors/artifacts.json
            ${{ runner.temp }}/reactors/losat-web-serial.wasm
            ${{ runner.temp }}/reactors/losat-web-threads.wasm
          retention-days: 3

  native:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
      - name: Native LOSAT, the V-ABI and V-BR expectation
        working-directory: LOSAT
        run: cargo build --release --locked
      - name: Keep the native CLI for the V-ABI and browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native
          path: LOSAT/target/release/losat
          retention-days: 3

  v-abi:
    needs: [changes, reactors, native]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reactors
          path: ${{ runner.temp }}/reactors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: ${{ runner.temp }}/native
      - run: chmod +x ${{ runner.temp }}/native/losat
      - name: V-ABI (quick suite)
        run: |
          python3 web/adapter/tools/v_abi_cases.py --suite quick --out ${{ runner.temp }}/v-abi-cases.json
          node web/adapter/tests/v_abi.js --native ${{ runner.temp }}/native/losat \
            --serial ${{ runner.temp }}/reactors/losat-web-serial.wasm \
            --threads ${{ runner.temp }}/reactors/losat-web-threads.wasm \
            --cases ${{ runner.temp }}/v-abi-cases.json

  # V-BR (plan §6.2): the application's EngineGateway and Engine worker with the reactors
  # of the reactors job, in Chromium, Firefox and WebKit, compared with the native CLI of the
  # same commit and NCBI's frozen bytes (tests/e2e/engine.spec.ts); the other E2E tests on
  # the application built with the engine; and the reactor tests in Node (the RecordScanner
  # contract on the serial reactor, responses of more than 1 MiB). One job per browser and
  # shard (until 2026-11 one job ran the three, 31 min): `--project` selects the same tests that
  # the browser ran there and `--shard` half of them for Firefox and WebKit (14.5 and 15.1 min a
  # job for the whole browser, Chromium 10.4), with the same two workers. Each job installs
  # Chromium as well, for the storage tests' Chromium profile (tests/e2e/support/profile.ts).
  browser-engine:
    name: browser-engine (${{ matrix.project }} ${{ matrix.shard }})
    needs: [changes, reactors, native]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1/1
            browsers: chromium
          - project: firefox
            shard: 1/2
            browsers: chromium firefox
          - project: firefox
            shard: 2/2
            browsers: chromium firefox
          - project: webkit
            shard: 1/2
            browsers: chromium webkit
          - project: webkit
            shard: 2/2
            browsers: chromium webkit
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reactors
          path: ${{ runner.temp }}/reactors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: ${{ runner.temp }}/native
      - run: chmod +x ${{ runner.temp }}/native/losat
      - run: npm ci
      # Usually 40 to 100 s. On 2026-11-11 the runners could not resolve the Ubuntu archive and apt
      # waited on every package, holding the job for hours; this step stops it instead.
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
        timeout-minutes: 10
      - name: RecordScanner contract on the serial reactor (Node)
        if: matrix.project == 'chromium'
        env:
          LOSAT_WEB_REACTORS: ${{ runner.temp }}/reactors
        run: npx vitest run tests/unit/engine-runtime.test.ts
      - name: V-BR and every E2E test with the engine in the build (${{ matrix.project }} ${{ matrix.shard }})
        env:
          LOSAT_WEB_REACTORS: ${{ runner.temp }}/reactors
          LOSAT_WEB_NATIVE: ${{ runner.temp }}/native/losat
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-engine-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/app/test-results/
          retention-days: 7

  # The check to require in the ruleset: it always runs and fails only if a job failed or was
  # cancelled (jobs skipped because no relevant file changed count as passed).
  # Only the pull_request run carries that name. A push run of a branch that an open pull request
  # covers skips every job (`changes`), so its gate passes within seconds, on the same commit, while
  # the pull request's own gate has no check run until the jobs it needs end; the rulesets took the
  # push run's for the pull request's. Auto-merge merged #843 at 03:16Z (2026-11-05) on the push
  # run's pass of 02:49Z, though its `app` had failed at 02:59Z; its own gate failed at 03:37Z.
  result:
    name: ${{ github.event_name == 'pull_request' && 'web result' || 'web result (push)' }}
    if: always()
    needs: [changes, app, engine-web-api, adapter, reactors, native, v-abi, browser-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "A job did not succeed." >&2
              exit 1
            fi
          done
