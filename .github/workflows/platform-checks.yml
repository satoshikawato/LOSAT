name: Platform checks

# LOSAT on Linux x64, Linux arm64, Windows x64, macOS arm64 and macOS x64, with the performance
# switches on (the default, LOSAT/src/utils/xswitch.rs) and off (LOSAT_X_DEFAULT=0, the reference
# paths):
#  - outputs: release binary, 49 cases (all five programs) at 1 and 4 threads in both modes; the
#    outputs of the two modes must be byte-identical and the exit codes 0 (LOSAT/tests/platform_checks.py);
#    on the two arm64 platforms a third mode, LOSAT_X_DPNEON=0 (the other switches on, the scalar
#    X-drop instead of the NEON kernels the default runs), must give the same outputs as well;
#  - compare: the hashes of the five platforms must equal each other (no expected hash is stored;
#    the frozen hashes are checked on Linux x64 by ci.yml);
#  - tests: cargo test --all-features in both modes on the four platforms other than Linux x64
#    (ci.yml runs both modes on Linux x64).
# Pull requests always start it (so that `platform checks result` exists and can be required), but
# its jobs run only when the engine, the Cargo files or this workflow's own files change (job
# `changes`); the schedule and workflow_dispatch run them always.
on:
  pull_request:
  schedule:
    - cron: '23 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # One always-present gate for the required check: the `on.pull_request` trigger has no `paths:`
  # filter (a required check of a workflow that did not run would block the pull request forever),
  # so this job decides whether the pull request touches relevant files.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pattern = the former `pull_request: paths:` list, as anchored extended regular
          # expressions (`**` = .*, `*` = [^/]*):
          #   LOSAT/src/**
          #   LOSAT/Cargo.toml
          #   LOSAT/Cargo.lock
          #   LOSAT/build.rs
          #   .github/workflows/platform-checks.yml
          #   LOSAT/tests/platform_checks.py
          #   LOSAT/tests/platform_check_cases.json
          pattern='^(LOSAT/src/.*|LOSAT/Cargo\.toml|LOSAT/Cargo\.lock|LOSAT/build\.rs|\.github/workflows/platform-checks\.yml|LOSAT/tests/platform_checks\.py|LOSAT/tests/platform_check_cases\.json)$'
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" -q '.[].filename')
          echo "Changed files:"
          printf '%s\n' "$files"
          if grep -Eq "$pattern" <<< "$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  outputs:
    name: default = LOSAT_X_DEFAULT=0 (${{ matrix.id }})
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, id: linux-x64, python: python3 }
          - { runner: ubuntu-24.04-arm, id: linux-arm64, python: python3, extra: '--extra-mode noneon=LOSAT_X_DPNEON=0' }
          - { runner: windows-2025, id: windows-x64, python: python }
          - { runner: macos-15, id: macos-arm64, python: python3, extra: '--extra-mode noneon=LOSAT_X_DPNEON=0' }
          - { runner: macos-15-intel, id: macos-x64, python: python3 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # Fixtures are compared byte for byte; keep Git for Windows from turning them into CRLF.
      - name: Check out without line-ending conversion
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LOSAT -> target
          key: outputs-${{ matrix.id }}
      - name: Build release binary
        run: cd LOSAT && cargo build --release --locked --bin LOSAT
      - name: Default against LOSAT_X_DEFAULT=0, 49 cases, 1 and 4 threads
        run: ${{ matrix.python }} LOSAT/tests/platform_checks.py run --losat LOSAT/target/release/LOSAT --out platform-check ${{ matrix.extra }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-checks-${{ matrix.id }}
          path: platform-check/rows.tsv
          if-no-files-found: error
          retention-days: 30

  compare:
    name: same hashes on all platforms
    needs: [changes, outputs]
    if: ${{ !cancelled() && needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-checks-*
          path: tables
      - name: Compare the tables of the five platforms
        run: |
          python3 LOSAT/tests/platform_checks.py compare \
            --table linux-x64=tables/platform-checks-linux-x64/rows.tsv \
            --table linux-arm64=tables/platform-checks-linux-arm64/rows.tsv \
            --table windows-x64=tables/platform-checks-windows-x64/rows.tsv \
            --table macos-arm64=tables/platform-checks-macos-arm64/rows.tsv \
            --table macos-x64=tables/platform-checks-macos-x64/rows.tsv

  tests:
    name: cargo test, ${{ matrix.mode }} (${{ matrix.id }})
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel]
        mode: [default, reference]
        include:
          - { runner: ubuntu-24.04-arm, id: linux-arm64 }
          - { runner: windows-2025, id: windows-x64 }
          - { runner: macos-15, id: macos-arm64 }
          - { runner: macos-15-intel, id: macos-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out without line-ending conversion
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LOSAT -> target
          key: tests-${{ matrix.id }}
      - name: cargo test --all-features
        run: |
          if [ "${{ matrix.mode }}" = reference ]; then export LOSAT_X_DEFAULT=0; fi
          cd LOSAT && cargo test --locked --all-features --no-fail-fast
        env:
          LOSAT_BLASTX_WORKER_LOG: ${{ runner.temp }}/blastx-worker.log
          # Optimized test code; the test profile keeps the dev profile's debug assertions
          # and overflow checks (as in ci.yml).
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'

  # The check to require in the ruleset: it always runs and fails only if a job failed or was
  # cancelled (jobs skipped because no relevant file changed count as passed).
  result:
    name: platform checks result
    if: always()
    needs: [changes, outputs, compare, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "A job did not succeed." >&2
              exit 1
            fi
          done
