name: Web

# Push runs only on main and dev. A push to another branch ran the whole set before the branch
# had a pull request, whose own run then tested the branch again: on 2026-11-11..12, 79 such runs
# took 6,628 of the repository's 15,684 job-minutes (42 %), and 39 % of the running jobs in the
# minutes when 35 or more ran, when jobs queued for a runner (the account's limit on concurrent
# jobs, shared with the owner's other repositories). Draft pull requests run the whole set;
# a branch without one runs it with `gh workflow run web.yml --ref <branch>` (the branch's own
# copy of this file runs, so the branch must contain this trigger). Tags start no run.
on:
  push:
    branches: [main, dev]
    paths:
      - 'web/**'
      - 'LOSAT/src/**'
      - 'LOSAT/build.rs'
      - 'LOSAT/Cargo.toml'
      - 'LOSAT/Cargo.lock'
      - 'LOSAT/.cargo/**'
      - 'LOSAT/tests/wasi_*.js'
      - 'LOSAT/tests/outfmt0_manifest.tsv'
      - 'docs/assets/losat-logo*.svg'
      - '.github/workflows/web.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One always-present gate for the required check: the `on.pull_request` trigger has no `paths:`
  # filter (a required check of a workflow that did not run would block the pull request forever),
  # so this job decides whether the pull request touches relevant files. For a push to dev it
  # also checks whether an open pull request covers the branch (the promotion pull request into
  # main): that pull request's run checks the same commit, so the push run would build it a second
  # time (2026-10-16, when every branch had push runs: 86 of 135 push runs on pull-request
  # branches in 72 hours, 2,447 runner-minutes). A workflow_dispatch run runs every job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" != main ]; then
            prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$REPO_OWNER:$REF_NAME" -q '.[].number' | tr '\n' ' ')
            if [ -n "${prs// /}" ]; then
              echo "Open pull request(s) $prs cover branch $REF_NAME: the jobs run in the pull_request run."
              echo "relevant=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pattern = the former `pull_request: paths:` list, as anchored extended regular
          # expressions (`**` = .*, `*` = [^/]*):
          #   web/**
          #   LOSAT/src/**
          #   LOSAT/build.rs
          #   LOSAT/Cargo.toml
          #   LOSAT/Cargo.lock
          #   LOSAT/.cargo/**
          #   LOSAT/tests/wasi_*.js
          #   LOSAT/tests/outfmt0_manifest.tsv
          #   LOSAT/tests/fixtures/web_v1_*/** (the vectors of the Web API v1 tests)
          #   LOSAT/tests/compressed/** (the zstd CLI files that web/adapter/tests/inflate.rs reads)
          #   docs/assets/losat-logo*.svg (the README's logos; tests/unit/logo.test.ts reads them)
          #   .github/workflows/web.yml
          pattern='^(web/.*|LOSAT/src/.*|LOSAT/build\.rs|LOSAT/Cargo\.toml|LOSAT/Cargo\.lock|LOSAT/\.cargo/.*|LOSAT/tests/wasi_[^/]*\.js|LOSAT/tests/outfmt0_manifest\.tsv|LOSAT/tests/fixtures/web_v1_[^/]*/.*|LOSAT/tests/compressed/.*|docs/assets/losat-logo[^/]*\.svg|\.github/workflows/web\.yml)$'
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" -q '.[].filename')
          echo "Changed files:"
          printf '%s\n' "$files"
          if grep -Eq "$pattern" <<< "$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # The application built with the FakeEngine: its unit tests, lint and build (`npm run check`,
  # in the Chromium job), and the E2E tests in one job per browser. Until 2026-11-12 one job ran
  # the three browsers (13.1 min, p50 of 7 runs), which became the longest path once the
  # reactors, native and browser-engine jobs were cut; `--project` selects the tests that the
  # browser ran there. Each job installs Chromium as well, for the storage tests' Chromium
  # profile (tests/e2e/support/profile.ts).
  app:
    name: app (${{ matrix.project }})
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    # About three times the longest of 224 passing runs of these jobs (7.8 min, 2026-11-12/13),
    # as for the other jobs here: a job that hangs (2026-11-11, below) gives its runner back.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browsers: chromium
          - project: firefox
            browsers: chromium firefox
          - project: webkit
            browsers: chromium webkit
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run check
        if: matrix.project == 'chromium'
      # Usually 40 to 100 s. On 2026-11-11 the runners could not resolve the Ubuntu archive and apt
      # waited on every package, holding the job for hours; this step stops it instead.
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
        timeout-minutes: 10
      - run: npm run e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: web/app/test-results/
          retention-days: 7

  # The web API tests compile only for wasm32, so the native `cargo test` in ci.yml
  # never runs them. Run them on wasm32-wasip1 under Node's WASI.
  engine-web-api:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Web API v1 tests on wasm32-wasip1
        working-directory: LOSAT
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/web/tools/wasi-test-runner.mjs
        run: cargo test --locked --lib --target wasm32-wasip1 --no-default-features -- web_api::tests

  # The engine adapter (web/adapter) over five jobs that run side by side: the build identity
  # with the certified engine builds (plan TD-6) and the index-scan property tests (TD-8) here;
  # the two reactors (`reactors`) and the native CLI of the same commit (`native`), each built
  # once on a runner of its own and kept as an artifact; V-ABI (`v-abi`): every supported format
  # of every program through ABI v2, compared with that CLI (plan §6.2); and V-BR
  # (`browser-engine`). Until 2026-11 the first four were steps of one job, 27 min in series,
  # and the browser job waited for all of them; each build is its own (the adapter tests in
  # web/adapter/target, the reactors in their own target directory, the CLI in LOSAT/target), so
  # nothing was shared between the steps.
  adapter:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1, wasm32-wasip1-threads
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build identity (plan TD-6)
        run: python3 web/adapter/tools/check_build_identity.py
      - name: Adapter tests
        working-directory: web/adapter
        run: cargo test --locked

  reactors:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-wasip1, wasm32-wasip1-threads
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # build_reactors.py runs the build identity check (plan TD-6) itself before it builds.
      - name: Reactors
        run: python3 web/adapter/tools/build_reactors.py --target-dir ${{ runner.temp }}/adapter-target --output-dir ${{ runner.temp }}/reactors
      - name: Keep the reactors for the V-ABI and browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reactors
          path: |
            ${{ runner.temp }}/reactors/artifacts.json
            ${{ runner.temp }}/reactors/losat-web-serial.wasm
            ${{ runner.temp }}/reactors/losat-web-threads.wasm
          retention-days: 3

  native:
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
      # This binary is only the expectation: V-ABI and V-BR compare the reactors' outputs with
      # its outputs, and V-ABI compares those with NCBI's frozen hashes as well. It is built with
      # Cargo's default release optimisation (no fat LTO, 16 codegen units): 2.7 min against 6.7
      # with the release profile's fat LTO on 4 CPUs (2026-11-12, dev 2d9093089), which links the
      # whole crate on one CPU. Link-time optimisation and codegen units change how the code is
      # compiled, not what it computes. ci.yml's `fast output regressions` tests the release
      # profile's binary itself (output hashes, frozen hashes, the floating-point contract).
      - name: Native LOSAT, the V-ABI and V-BR expectation
        working-directory: LOSAT
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --release --locked
      - name: Keep the native CLI for the V-ABI and browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native
          path: LOSAT/target/release/losat
          retention-days: 3

  v-abi:
    needs: [changes, reactors, native]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reactors
          path: ${{ runner.temp }}/reactors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: ${{ runner.temp }}/native
      - run: chmod +x ${{ runner.temp }}/native/losat
      # One process per reactor, at once (`--engines`): the serial reactor runs each search with 1
      # thread, the threaded one with 1, 2 and 4, and each process runs the CLI for its own
      # comparisons. In one process, one reactor after the other, the step took 11.6 min (p50 of
      # 69 runs, 2026-11-12/13; serial 43 %, threaded 57 %) and was the longest path of the
      # workflow in 46 of them. The first process to fail ends the step and stops the other.
      - name: V-ABI (quick suite)
        run: |
          python3 web/adapter/tools/v_abi_cases.py --suite quick --out ${{ runner.temp }}/v-abi-cases.json
          for engine in serial threads; do
            node web/adapter/tests/v_abi.js --native ${{ runner.temp }}/native/losat \
              --serial ${{ runner.temp }}/reactors/losat-web-serial.wasm \
              --threads ${{ runner.temp }}/reactors/losat-web-threads.wasm \
              --cases ${{ runner.temp }}/v-abi-cases.json --engines "$engine" &
          done
          wait -n || { kill $(jobs -p) 2>/dev/null; exit 1; }
          wait -n

  # V-BR (plan §6.2): the application's EngineGateway and Engine worker with the reactors
  # of the reactors job, in Chromium, Firefox and WebKit, compared with the native CLI of the
  # same commit and NCBI's frozen bytes (tests/e2e/engine.spec.ts); the other E2E tests on
  # the application built with the engine; and the reactor tests in Node (the RecordScanner
  # contract on the serial reactor, responses of more than 1 MiB, and the inflation of
  # compressed sources and Example sets with the engine's decoders: bytes, sentences, limit).
  # One job per browser and shard (until 2026-11 one job ran the three, 31 min): `--project`
  # selects the same tests that the browser ran there and `--shard` a part of them, with the same
  # two workers. Playwright splits a project's tests by count, in order, not by duration: in two
  # shards (2026-11-12, p50 of 7 runs) the tests took Chromium 8.4 min in one shard, Firefox
  # 6.4 + 6.2, WebKit 4.0 + 7.6; now Chromium and Firefox run in two shards, WebKit in three.
  # Each job installs Chromium as well, for the storage tests' Chromium profile
  # (tests/e2e/support/profile.ts).
  browser-engine:
    name: browser-engine (${{ matrix.project }} ${{ matrix.shard }})
    needs: [changes, reactors, native]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    # About three times the longest of 527 passing runs of the shards (11.6 min, 2026-11-12/13).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1/2
            browsers: chromium
          - project: chromium
            shard: 2/2
            browsers: chromium
          - project: firefox
            shard: 1/2
            browsers: chromium firefox
          - project: firefox
            shard: 2/2
            browsers: chromium firefox
          - project: webkit
            shard: 1/3
            browsers: chromium webkit
          - project: webkit
            shard: 2/3
            browsers: chromium webkit
          - project: webkit
            shard: 3/3
            browsers: chromium webkit
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reactors
          path: ${{ runner.temp }}/reactors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: ${{ runner.temp }}/native
      - run: chmod +x ${{ runner.temp }}/native/losat
      - run: npm ci
      # Usually 40 to 100 s. On 2026-11-11 the runners could not resolve the Ubuntu archive and apt
      # waited on every package, holding the job for hours; this step stops it instead.
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
        timeout-minutes: 10
      - name: RecordScanner contract and inflation on the serial reactor (Node)
        if: matrix.project == 'chromium' && matrix.shard == '1/2'
        env:
          LOSAT_WEB_REACTORS: ${{ runner.temp }}/reactors
        run: npx vitest run tests/unit/engine-runtime.test.ts
      - name: V-BR and every E2E test with the engine in the build (${{ matrix.project }} ${{ matrix.shard }})
        env:
          LOSAT_WEB_REACTORS: ${{ runner.temp }}/reactors
          LOSAT_WEB_NATIVE: ${{ runner.temp }}/native/losat
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-engine-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/app/test-results/
          retention-days: 7

  # The check to require in the ruleset: it always runs and fails only if a job failed or was
  # cancelled (jobs skipped because no relevant file changed count as passed).
  # Only the pull_request run carries that name; a push or workflow_dispatch run reports
  # `web result (push)` or `web result (workflow_dispatch)`. A push run of a branch that an open
  # pull request covers skips every job (`changes`), so its gate passes within seconds, on the same
  # commit, while the pull request's own gate has no check run until the jobs it needs end; the
  # rulesets took the push run's for the pull request's. Auto-merge merged #843 at 03:16Z
  # (2026-11-05) on the push run's pass of 02:49Z, though its `app` had failed at 02:59Z; its own
  # gate failed at 03:37Z.
  result:
    name: ${{ github.event_name == 'pull_request' && 'web result' || format('web result ({0})', github.event_name) }}
    if: always()
    needs: [changes, app, engine-web-api, adapter, reactors, native, v-abi, browser-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              echo "A job did not succeed." >&2
              exit 1
            fi
          done
