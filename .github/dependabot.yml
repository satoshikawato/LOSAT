# Dependabot version updates. Work pull requests merge into dev, so version updates open their
# pull requests against dev (target-branch). GitHub reads this file from the default branch,
# main: main and dev carry the same file. Security updates are a repository setting and keep
# targeting main.
#
# - cargo: LOSAT and web/adapter in one pull request per dependency (group-by: dependency-name).
#   web/adapter/tools/check_build_identity.py (web.yml, job `adapter`) requires both Cargo.lock
#   files to hold the same version of every dependency they share.
# - npm: minor and patch updates of web/app in one pull request; each major update in its own.
# - auto-merge.yml does not turn on auto-merge for these pull requests: a person merges each one.
# - cooldown: a release is considered 7 days after it was published.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /LOSAT
      - /web/adapter
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cargo:
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /web/app
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
