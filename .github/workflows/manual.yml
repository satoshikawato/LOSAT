name: User manual

# Builds the user manual (docs/manual, mdBook) on every change to it, and publishes it to
# GitHub Pages only when someone starts this workflow by hand on main (Actions > User manual >
# Run workflow). Publishing needs Pages turned on with "GitHub Actions" as the source
# (Settings > Pages), which the repository owner does.

on:
  pull_request:
    paths:
      - "docs/manual/**"
      - "docs/release/v0.2.0.md"
      - "README.md"
      - "LOSAT/README.md"
      - "python/README.md"
      - "web/packages/losat/README.md"
      - "packaging/bioconda/README.md"
      - "benchmarks/**"
      - ".github/workflows/manual.yml"
      - "scripts/check_manual_links.py"
      - "tests/test_check_manual_links.py"
  push:
    branches: [dev]
    paths:
      - "docs/manual/**"
      - "docs/release/v0.2.0.md"
      - "README.md"
      - "LOSAT/README.md"
      - "python/README.md"
      - "web/packages/losat/README.md"
      - "packaging/bioconda/README.md"
      - "benchmarks/**"
      - ".github/workflows/manual.yml"
      - "scripts/check_manual_links.py"
      - "tests/test_check_manual_links.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/mdbook.tar.gz" "$url"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Test the source check
        run: python3 -m unittest tests/test_check_manual_links.py
      - name: Check links between pages
        run: |
          python3 scripts/check_manual_links.py docs/manual/src \
            --repo-root . \
            --repo-readme README.md \
            --repo-readme benchmarks/README.md \
            --repo-readme benchmarks/v0.2.0/README.md \
            --repo-readme docs/release/v0.2.0.md \
            --repo-readme packaging/bioconda/README.md \
            --package-readme LOSAT/README.md \
            --package-readme python/README.md \
            --package-readme web/packages/losat/README.md \
            --check-figure-sync
      - name: Build
        run: mdbook build docs/manual
      - name: Keep the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/manual/book

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
