# cargo-nextest configuration of ci.yml's `rust-tests` (archive) and `rust-tests-run` (shards),
# passed with --config-file. The archive of the test binaries also carries the examples:
# tests/library_api.rs, outfmt11_titles.rs, outfmt13_16_titles.rs and blastx_library_db_hold.rs
# run them from the directory of `losat` (target/debug/examples) and build them with cargo only
# when missing.
[profile.default.archive]
include = [
  { path = "debug/examples", relative-to = "target", on-missing = "error" },
]
