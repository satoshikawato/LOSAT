name: Python wheels

# The wheels of pylosat (python/, the Python binding of the library API; plan
# docs/losat_library_surface_plan.md §4.3, LIB-5): one abi3 wheel per platform, for CPython 3.10
# and later, built as the native release binaries are (release-readiness-v020.yml, job
# native-artifacts): on the same runner images, for their host targets, with Rust 1.92.0 and, by
# python/Cargo.toml and python/.cargo/config.toml, LOSAT's release profile (panic = "unwind" aside)
# and x86-64 rustflags. `maturin build` runs on the runner itself; `--auditwheel check` fails a wheel
# that needs a library outside the manylinux set, instead of copying it into the wheel. On Linux, zig
# links the wheel against the symbols of glibc 2.17 (`--zig --compatibility manylinux2014`), so that
# it installs on glibc 2.17 and later although the image's glibc is 2.39; maturin fails a wheel that
# needs a newer symbol. zig links with its own LLD and C runtime objects and puts LLVM's libunwind
# into the wheel instead of loading libgcc_s; the reports are the same, and time and memory are
# within the runs' spread (A/B of 2026-11-20, x86-64 and aarch64). Elsewhere
# `--compatibility pypi` fails a wheel whose tags PyPI would refuse.
#
# Each wheel is installed into a fresh virtual environment of the oldest and of the newest CPython
# it serves, and a blastp search through it must write the report and the diagnostics whose hashes
# the command line is checked against on every pull request (python/tools/wheel_smoke.py). The job
# summary shows each wheel's tags and size. The wheels are kept as workflow artifacts for 7 days.
#
# The source distribution (job `sdist`) is what `pip install pylosat` builds where no wheel fits: the
# job builds a wheel from it as pip does and runs the same search.
#
# Publishing is the maintainer's act (job `publish`, RELEASE.md): a run started by hand with `publish`
# uploads the five wheels and the sdist of that run to PyPI, or to TestPyPI as a rehearsal. Every job
# builds the commit the run was started on; a run that uploads to PyPI must be the source of the
# release's tag `v<version>` (.github/scripts/release_tag_source.sh, first in job `sdist`: the tag is
# checked, never checked out). No token is stored: PyPI trusts this workflow file in the environment
# `pypi` (Trusted Publishing, OpenID Connect), and the environment's required reviewer approves the
# upload. Every other run uploads nothing.
#
# When it runs (the macOS jobs are the scarce runners: see platform-checks.yml):
#  - workflow_dispatch and push to main when the binding, the engine or the smoke's inputs change:
#    the five platforms;
#  - weekly: GitHub starts schedules only on main, so the scheduled run starts a run of dev (job
#    `dev`, as in nightly.yml) and fails when the last completed run of dev did not pass;
#  - a pull request that changes python/ or this file, once it is not a draft: Linux x64 only. An
#    engine change alone builds the binding in python.yml (debug) and its wheels on main and weekly.
on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'LOSAT/src/**'
      - 'LOSAT/build.rs'
      - 'LOSAT/Cargo.toml'
      - 'LOSAT/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/evidence/losat_web_e1a/baseline/hashes.tsv'
      - 'LOSAT/tests/fasta/SicyWSV.faa'
      - 'LOSAT/tests/fasta/PajaWSV.faa'
      - '.github/workflows/python-wheels.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'python/**'
      - '.github/workflows/python-wheels.yml'
  schedule:
    - cron: '7 21 * * 6'
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to upload what this run builds (the maintainer's act; pypi: start the run on the release's tag or on main at it)"
        type: choice
        options: [nowhere, testpypi, pypi]
        default: nowhere

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheel:
    name: wheel ${{ matrix.runner }}
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        # The runners of the release binaries: Linux x64, Linux arm64, Windows x64, macOS arm64,
        # macOS x64.
        runner: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]'
          || '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "macos-15", "macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # The smoke's inputs are compared byte for byte; keep Git for Windows from turning them into
      # CRLF (as in platform-checks.yml).
      - name: Check out without line-ending conversion
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0

      # The oldest CPython the abi3 wheel serves (abi3-py310, python/Cargo.toml) and the newest.
      - id: oldest
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - id: newest
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Build the wheel
        working-directory: python
        env:
          PYTHON: ${{ steps.newest.outputs.python-path }}
          # The toolchain above. Without it, the build's first cargo call had rustup add the clippy,
          # rustfmt and Wasm targets of the root rust-toolchain.toml to the toolchain, which failed on
          # ubuntu-24.04-arm ("detected conflict: 'bin/cargo-clippy'", 2026-11-13); the release
          # build needs none of them.
          RUSTUP_TOOLCHAIN: 1.92.0
          # The Python whose ziglang package maturin runs as zig (else `python3` on PATH).
          CARGO_ZIGBUILD_PYTHON_PATH: ${{ steps.newest.outputs.python-path }}
        run: |
          set -euo pipefail
          # The maturin of python.yml's tests, pinned in one place.
          maturin=$(grep '^maturin==' tests/requirements.txt)
          if [ "$RUNNER_OS" = Linux ]; then
            # zig for the link, only here (the version of the trial run 44672341945).
            "$PYTHON" -m pip install --disable-pip-version-check --quiet "$maturin" ziglang==0.17.1
            compatibility=(--zig --compatibility manylinux2014)
          else
            "$PYTHON" -m pip install --disable-pip-version-check --quiet "$maturin"
            compatibility=(--compatibility pypi)
          fi
          "$PYTHON" -m maturin build --release --locked "${compatibility[@]}" --auditwheel check \
            --interpreter "$PYTHON" --out dist

      - name: Install it in fresh environments and search
        working-directory: python
        env:
          OLDEST: ${{ steps.oldest.outputs.python-path }}
          NEWEST: ${{ steps.newest.outputs.python-path }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected one wheel in python/dist, found ${#wheels[@]}"
            exit 1
          fi
          wheel=$GITHUB_WORKSPACE/python/${wheels[0]}
          {
            echo "### pylosat wheel, $RUNNER_LABEL"
            echo
            echo "| Python | wheel | tags | size | blastp report (SicyWSV x PajaWSV, outfmt 6) |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for oldest_or_newest in oldest newest; do
            if [ $oldest_or_newest = oldest ]; then python=$OLDEST; else python=$NEWEST; fi
            venv=$RUNNER_TEMP/venv-$oldest_or_newest
            "$python" -m venv "$venv"
            if [ "$RUNNER_OS" = Windows ]; then py=$venv/Scripts/python.exe; else py=$venv/bin/python; fi
            "$py" -m pip install --disable-pip-version-check --quiet --no-index --no-deps "$wheel"
            # Outside the checkout and with -I, so that the import finds the wheel's pylosat.
            (cd "$RUNNER_TEMP" && "$py" -I "$GITHUB_WORKSPACE/python/tools/wheel_smoke.py" \
              --repo "$GITHUB_WORKSPACE" --wheel "$wheel") | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # The oldest glibc the Linux wheel serves: the same install and search with CPython 3.10 of
      # the manylinux2014 image (CentOS 7, glibc 2.17), pinned by digest (tag 2026.11.14-1).
      - name: Install it on glibc 2.17 and search
        if: runner.os == 'Linux'
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          IMAGE: >-
            ${{ runner.arch == 'ARM64'
            && 'quay.io/pypa/manylinux2014_aarch64@sha256:c2995cae5e2d433fbe757d1466486727b3edd68ba644cd60df253365f35fda9e'
            || 'quay.io/pypa/manylinux2014_x86_64@sha256:e6a785657009c612fe2a85fa933051d03a50ba62b1c5e47d62abcab546a2e423' }}
        run: |
          set -euo pipefail
          wheel=$(cd python && ls dist/*.whl)
          {
            echo "### pylosat wheel on glibc 2.17, $RUNNER_LABEL"
            echo
            echo "| Python | wheel | tags | size | blastp report (SicyWSV x PajaWSV, outfmt 6) |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$GITHUB_WORKSPACE:/w:ro" -w /tmp "$IMAGE" bash -euo pipefail -c '
            getconf GNU_LIBC_VERSION >&2
            /opt/python/cp310-cp310/bin/python -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --disable-pip-version-check --quiet --no-index --no-deps "/w/python/$0"
            /tmp/venv/bin/python -I /w/python/tools/wheel_smoke.py --repo /w --wheel "/w/python/$0"
          ' "$wheel" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pylosat-wheel-${{ matrix.runner }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: sdist
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0

      - id: newest
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      # First, so that a run that would upload something else than the release stops within a minute:
      # PyPI takes the source of the tag v<version> only; on TestPyPI anything else is a notice.
      - name: The release's tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish != 'nowhere'
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 --manifest-path python/Cargo.toml \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pylosat"))')
          uploads=false
          if [ "$PUBLISH" = pypi ]; then uploads=true; fi
          .github/scripts/release_tag_source.sh "$version" "$uploads"

      # The sdist holds python/ and the engine's crate (LOSAT/, the path dependency), with both lock
      # files. `twine check --strict` fails a description that PyPI would not render.
      - name: Build the sdist
        working-directory: python
        env:
          PYTHON: ${{ steps.newest.outputs.python-path }}
          RUSTUP_TOOLCHAIN: 1.92.0
        run: |
          set -euo pipefail
          "$PYTHON" -m pip install --disable-pip-version-check --quiet \
            "$(grep '^maturin==' tests/requirements.txt)" "$(grep '^twine==' tests/requirements.txt)"
          "$PYTHON" -m maturin sdist --out dist
          "$PYTHON" -m twine check --strict dist/*.tar.gz

      # What pip does where no wheel fits the platform: unpack the sdist and build it with maturin
      # (the pinned one, in this environment instead of pip's build isolation).
      - name: Build a wheel from the sdist, install it and search
        env:
          PYTHON: ${{ steps.newest.outputs.python-path }}
          RUSTUP_TOOLCHAIN: 1.92.0
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(python/dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected one sdist in python/dist, found ${#sdists[@]}"
            exit 1
          fi
          sdist=$GITHUB_WORKSPACE/${sdists[0]}
          (cd "$RUNNER_TEMP" && "$PYTHON" -m pip wheel --disable-pip-version-check --quiet \
            --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/from-sdist" "$sdist")
          wheels=("$RUNNER_TEMP"/from-sdist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected one wheel built from the sdist, found ${#wheels[@]}"
            exit 1
          fi
          venv=$RUNNER_TEMP/venv-from-sdist
          "$PYTHON" -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --quiet --no-index --no-deps "${wheels[0]}"
          {
            echo "### pylosat sdist, $(basename "$sdist"), $(stat -c %s "$sdist") bytes; the wheel built from it"
            echo
            echo "| Python | wheel | tags | size | blastp report (SicyWSV x PajaWSV, outfmt 6) |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          (cd "$RUNNER_TEMP" && "$venv/bin/python" -I "$GITHUB_WORKSPACE/python/tools/wheel_smoke.py" \
            --repo "$GITHUB_WORKSPACE" --wheel "${wheels[0]}") | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pylosat-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The maintainer's upload (RELEASE.md). The environment `pypi` (or `testpypi`) names the trusted
  # publisher on PyPI and holds the required reviewer; `id-token: write` lets this job alone ask
  # GitHub for the OpenID Connect token that PyPI exchanges for a short-lived upload token.
  publish:
    name: publish to ${{ inputs.publish }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'nowhere'
    needs: [wheel, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.publish }}
      url: ${{ inputs.publish == 'pypi' && 'https://pypi.org/project/pylosat/' || 'https://test.pypi.org/project/pylosat/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pylosat-*
          path: dist
          merge-multiple: true

      # PyPI never takes a file name twice, also after a deletion: a wrong upload cannot be replaced.
      - name: Check what will be uploaded
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          files = sorted(os.listdir("dist"))
          print("\n".join(files))
          sdists = [name for name in files if name.endswith(".tar.gz")]
          wheels = [name for name in files if name.endswith(".whl")]
          problems = []
          if len(sdists) != 1 or len(sdists) + len(wheels) != len(files):
              sys.exit(f"expected one sdist and wheels only: {files}")
          version = re.fullmatch(r"pylosat-(\d+\.\d+\.\d+)\.tar\.gz", sdists[0])
          if version is None:
              sys.exit(f"the sdist's name is not pylosat-<x.y.z>.tar.gz: {sdists[0]}")
          version = version.group(1)
          # One abi3 wheel per platform of the release binaries.
          platforms = {
              "Linux x86-64": r"manylinux\w+_x86_64(\.manylinux\w+_x86_64)*",
              "Linux arm64": r"manylinux\w+_aarch64(\.manylinux\w+_aarch64)*",
              "Windows x64": r"win_amd64",
              "macOS arm64": r"macosx_\d+_\d+_arm64",
              "macOS x86-64": r"macosx_\d+_\d+_x86_64",
          }
          for label, platform in platforms.items():
              pattern = rf"pylosat-{re.escape(version)}-cp310-abi3-{platform}\.whl"
              found = [name for name in wheels if re.fullmatch(pattern, name)]
              if len(found) != 1:
                  problems.append(f"{label}: expected one wheel, found {found}")
          if len(wheels) != len(platforms):
              problems.append(f"expected {len(platforms)} wheels, found {len(wheels)}")
          if problems:
              sys.exit("\n".join(problems))
          print(f"pylosat {version}: the sdist and {len(wheels)} wheels")
          PY

      # The action checks the metadata of every file (twine check) and uploads the files with their
      # attestations (PEP 740), which name this repository, workflow and commit. `skip-existing`: when
      # an upload stopped after some of the files, "Re-run failed jobs" uploads the rest of the same
      # artifacts instead of failing on the first file that PyPI already holds.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
          repository-url: ${{ inputs.publish == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  dev:
    name: start the run of dev
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start a run of dev and check the last completed one
        run: |
          set -euo pipefail
          last=$(gh run list --workflow python-wheels.yml --branch dev --event workflow_dispatch \
            --status completed --limit 1 --json conclusion,headSha,url \
            --jq '.[] | [.conclusion, .headSha, .url] | @tsv')
          gh workflow run python-wheels.yml --ref dev
          echo "Started a wheels run of dev."
          if [ -z "$last" ]; then
            echo "No completed wheels run of dev yet."
            exit 0
          fi
          read -r conclusion sha url <<< "$last"
          if [ "$conclusion" != success ]; then
            echo "::error::The last wheels run of dev (${sha:0:9}) ended '$conclusion': $url"
            exit 1
          fi
          echo "The last wheels run of dev (${sha:0:9}) passed: $url"
