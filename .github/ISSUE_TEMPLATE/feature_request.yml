name: Feature request
description: Ask for an NCBI BLAST+ program, option or output that LOSAT does not support yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        LOSAT reimplements NCBI BLAST+. Under its rules (AGENTS.md, requirement 5), a feature that NCBI BLAST+ does not have is not accepted.
        Please name where NCBI BLAST+ has the feature, so that LOSAT can match its behavior.
  - type: dropdown
    id: in_ncbi
    attributes:
      label: Does NCBI BLAST+ have this feature?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: ncbi
    attributes:
      label: Where NCBI BLAST+ has it
      description: The program, option or output format, the NCBI BLAST+ version, and an example command line. Leave it empty if NCBI BLAST+ does not have the feature.
      render: shell
    validations:
      required: false
  - type: textarea
    id: use
    attributes:
      label: What you would use it for
      description: The task or workflow that needs it in LOSAT.
    validations:
      required: true
