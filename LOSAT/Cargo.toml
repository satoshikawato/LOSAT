[package]
name = "losat"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
autotests = false
description = "A pure-Rust reimplementation of NCBI BLAST+ 2.17.0 that runs BLAST+ command lines, as the losat command and the losat::api library"
license = "MIT"
homepage = "https://satoshikawato.github.io/LOSAT/"
repository = "https://github.com/satoshikawato/LOSAT"
readme = "README.md"
keywords = ["blast", "bioinformatics", "alignment", "wasm", "genomics"]
categories = ["science::bioinformatics", "command-line-utilities"]
exclude = [
    ".tmp/",
    "tests/",
    "losat_out/",
    "**/*.pyc",
    "**/*.tmp",
    "**/*.orig",
    # The source files that only unit tests read (`#[cfg(test)] mod x_tests;`, a table a test
    # `include!`s): neither a build of the package, nor the one `cargo publish` verifies it with, nor
    # docs.rs reads them, and they were 0.58 MiB of the 7.84 MiB crate (2026-11-20; crates.io takes
    # 10 MiB). tests/check_crate_test_files.py (CI) fails when a file the build reads matches one
    # of these, or when a file only tests read is packaged.
    "src/**/*_tests.rs",
    "src/**/tests.rs",
    "src/**/tests_*.rs",
    "src/**/*_tests/",
    "src/utils/test_dir.rs",
    "src/core/composition_adjustment/blosum62_joint_probs.inc.rs",
    "src/core/composition_adjustment/blosum62_start_freq_ratios.inc.rs",
]

# docs.rs documents the default features for Linux x86-64.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# The cdylib is the ABI v1 WASI reactor (`cargo build --lib --target wasm32-wasip1`).
[lib]
crate-type = ["rlib", "cdylib"]

# The command is `losat` (`losat.exe`, `losat.wasm`), as are the package and the library crate
# (`use losat::api`). The reactor and the WASI command are both `losat.wasm`: a WASI build names
# its target (`--lib` or `--bin losat`), so that Cargo copies only that one to `release/`.
[[bin]]
name = "losat"
path = "src/main.rs"

# The files of tests/ are modules of six suite binaries (tests/suites/<name>.rs, one `#[path]` module per
# file) instead of one binary each; the two files that change the process environment or
# process-wide state (the counting global allocator of thread_memory) stay alone. Unit tests live in
# the crate, next to the code they test (`#[cfg(test)]`).
# tests/suite_layout.rs checks that every file is in exactly one test binary.
[[test]]
name = "blastn"
path = "tests/suites/blastn.rs"

[[test]]
name = "blastp"
path = "tests/suites/blastp.rs"

[[test]]
name = "blastx"
path = "tests/suites/blastx.rs"

[[test]]
name = "tblastn"
path = "tests/suites/tblastn.rs"

[[test]]
name = "tblastx"
path = "tests/suites/tblastx.rs"

[[test]]
name = "common"
path = "tests/suites/common.rs"

[[test]]
name = "blastn_report_stream_api"
path = "tests/blastn_report_stream_api.rs"

[[test]]
name = "thread_memory"
path = "tests/thread_memory.rs"

[dependencies]
anyhow = "1.0"
rayon = { version = "1.11", optional = true }
indicatif = "0.18"
rustc-hash = "2.1"
# Compressed input (`-query`, `-subject`, `makeblastdb -in` named `.gz`, `.bz2` or `.zst`), with
# pure-Rust decoders only, as the pure-Rust runtime boundary requires (no C library, no `links`
# metadata): flate2's zlib-rs backend, bzip2's libbz2-rs-sys backend (not bzip2-sys), and
# ruzstd (a decoder; LOSAT never compresses). bzip2 0.6 builds libbz2-rs-sys by default; its `bzip2-sys`
# feature (the C library) is never enabled. zlib-rs is a Rust port of zlib's inflate (no build
# script, no `links`), so that a `.gz` file inflates, and fails, as in makeblastdb, which calls the
# system's zlib (`blastinput::compressed::GzipMembers`); flate2's default miniz_oxide backend accepts
# data that zlib refuses (a distance past the window start, a block without its end code).
# `runtime_detection` lets zlib-rs pick its SIMD copy and checksum paths at run time (std).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
bzip2 = "0.6"
ruzstd = "0.9"

# NCBI reference (598d8ae6): c++/include/corelib/ncbistre.hpp:437-440
# NCBI reference (598d8ae6): c++/src/corelib/stream_utils.cpp:235-236
# LMDB 0.9.24 (NCBI 598d8ae6 copy): c++/src/util/lmdb/mdb.c:395,3969 (`GET_PAGESIZE`; LMDB's
# notice and the OpenLDAP Public License 2.8: THIRD_PARTY_NOTICES, section 2 (LMDB))
# Rust system calls for the native readable-byte hint (`io`), and for the page size
# of the LMDB files of version 5 (`writedb::platform::host_page_size`): `param`
# (rustix's `sysconf` query of `_SC_PAGESIZE` on macOS and the BSDs) and `mm` (the kernel's
# alignment through `mmap` and `mprotect` on Linux, which needs neither /proc nor
# the C library), and the read-only mappings of the RPS-BLAST profile files
# (`utils::mapped_file`, as NCBI's `CMemoryFile`), and `fs` for the write-permission
# test of makeblastdb's output directory (`access`, which NCBI's `euidaccess` calls,
# `writedb::build_db::check_access_write`). `try_close` reports the error of the
# `close` system call that the output files of makeblastdb can have (`writedb::ofstream`). No BLAST behavior, foreign algorithm, NCBI runtime/build
# dependency or libc-auxv feature (the pure-Rust runtime boundary,
# tests/check_pure_rust_runtime_boundary.py, allows no direct libc call). A caret requirement
# like every other dependency: Cargo.lock fixes the exact version for every build from this
# repository (CI and the release with --locked), and Dependabot moves it.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "param", "mm", "fs", "stdio", "try_close"] }

# Windows file-handle type (`GetFileType`, `GetConsoleMode`) for the stream-position test of
# `IsIStreamEmpty` (`input_files::has_stream_position`), the read-only file mappings of the
# RPS-BLAST profile files (`utils::mapped_file`: `CreateFileMappingW`, whose signature names
# `SECURITY_ATTRIBUTES`, and `MapViewOfFile`), and the system time zone and character types that
# the C runtime's `localtime` reads (`writedb::windows_zone`: `GetTimeZoneInformation`,
# `GetStringTypeW`); only the features those need.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Time"] }

# The local time zone on every target but Windows (`writedb::local_offset`; Owner 2026-11-20
# 16:27 JST 「TZ=A」): jiff reads the zone file (TZif) or the POSIX rule that `TZ` gives, and
# LOSAT finds the zone file where glibc finds it. Only `alloc`: no bundled time zone data and no
# lookup of jiff's own (`tz-system`, `tzdb-*`), so a target without a zone file (the Web) is UTC.
# License: Unlicense OR MIT; LOSAT takes MIT.
[target.'cfg(not(windows))'.dependencies]
jiff = { version = "0.2.46", default-features = false, features = ["alloc"] }

# LOSAT Web's ABI v1 (`web_v1_argv`, frozen, plan TD-1) reads its words with its copy of the clap
# command that LOSAT's command line had when v1 was frozen, so that v1's messages stay; the
# programs read their arguments with NCBI's argument reader (`cli::reader`, line RG item K4i-3c),
# and the native builds link no clap; nor does the WASI command line, which leaves ABI v1 out
# (feature `no-web-abi-v1`, line RG item K4i-3d). Its tests run natively (dev-dependencies). No
# derive.
[target.'cfg(target_arch = "wasm32")'.dependencies]
clap = "4.5"

# The unit tests of `writedb::windows_zone` compare UCRT's system zones with the POSIX rules that
# jiff reads (`writedb::local_offset::offset_from_posix_tz`), on Windows too; the tests of ABI v1
# (`web_v1_argv`) read with clap's command, as above.
[dev-dependencies]
jiff = { version = "0.2.46", default-features = false, features = ["alloc"] }
clap = "4.5"

[features]
default = ["parallel"]
# EXPERIMENT: work counters (off by default so they cost nothing)
xstats = []
# Diagnostic-only: the trace, debug, dump and profile variables that no test, script or CI step
# sets (`utils/xdiag.rs`, docs/agents/diagnostics.md "Diagnostic build"). A build without it ignores
# them and says so on stderr. No NCBI counterpart.
diagnostics = []
parallel = ["rayon"]
# NCBI reference (598d8ae6): c++/src/algo/blast/blastinput/blast_args.cpp:3205-3222
#
# Standard WASI aliases and packaging select this feature together with the
# wasm32-wasip1-threads target and a runtime that implements thread spawning.
# Explicit wasm32-wasip1 and wasm32-unknown-unknown builds remain serial.
wasm-threads = ["parallel"]
# NCBI reference (598d8ae6): c++/src/algo/blast/core/blast_engine.c:1659-1664
# Diagnostic-only host clock/worker identity; never read by search or reporting.
blastx-worker-probe = []
# Diagnostic-only parity switch. NCBI BLAST has a single scalar C control flow
# for TBLASTX ungapped extension/reevaluation (aa_ungapped.c:846-921,
# blast_hits.c:675-733); this feature forces the Wasm build to use the matching
# Rust scalar path even when the target enables simd128.
tblastx-wasm-scalar = []
# Leaves LOSAT Web's ABI v1 (`losat_web_*`, docs/web/abi_v1.md: the exports `web_api` and their
# argument reader `web_v1_argv`, with clap) out of a wasm32 build. The WASI command line
# (`--bin losat`) selects it, so that `losat.wasm` exports only `_start` and links no clap (line RG
# item K4i-3d). Every wasm32 build without it keeps ABI v1, as before: the Web's modules
# (web/adapter), LOSAT's reactors (`--lib`) and gbdraw's serial module, which is built
# `--lib --no-default-features` (plan TD-1). No effect on other targets (build.rs sets
# `losat_web_abi_v1` only on wasm32). No NCBI counterpart.
no-web-abi-v1 = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

# Optimized test code; the test profile keeps the dev profile's debug assertions
# and overflow checks. CI builds it at opt-level 3 with line tables only
# (CARGO_PROFILE_TEST_* in .github/workflows/ci.yml and platform-checks.yml): the
# tests ran 5 % faster than at level 1, and line tables cut the build by a fifth.
[profile.test]
opt-level = 1

# Lint levels of every target of the package (lib, bins, tests, examples).
# A lint is allowed here only with a reason. A single place that keeps a lint's shape on purpose
# uses `#[expect(lint, reason = "...")]` at that item instead of an entry here.

[lints.clippy]
# NCBI's C functions are ported argument by argument (e.g. Blast_SemiGappedAlign,
# blast_gapalign.c), so a reviewer reads the Rust call next to the C one.
too_many_arguments = "allow"
# Per-thread and per-batch results are nested tuples and vectors that follow NCBI's structures.
type_complexity = "allow"
# Index loops address several arrays with one index, as NCBI's C does; iterators change the
# generated code of the lookup, scan and extension loops.
needless_range_loop = "allow"
explicit_counter_loop = "allow"
# NCBI's tables keep NCBI's digits so they diff against NCBI's source; each literal rounds to
# the same f64.
excessive_precision = "allow"
# Functions that take a list of ranges are given the whole span as one range.
single_range_in_vec_init = "allow"
