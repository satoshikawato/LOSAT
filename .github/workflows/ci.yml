name: CI

# Throwaway measurement branch of ci-rust-speed s21 (2026-11-13): cargo --timings of the test build
# as ci.yml's `rust-tests` does it, and of its two halves. Not for merging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timings:
    name: timings (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: all
            targets: ""
          - arm: lib-tests
            targets: "--lib"
          - arm: rest
            targets: "--bins --examples --test *"
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '3'
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0
      - name: dependencies (fetch, build of the dependencies only)
        run: |
          cd LOSAT && cargo fetch --locked
          nproc; free -g
      - name: cargo test --no-run --timings ${{ matrix.targets }}
        run: |
          cd LOSAT && cargo test --locked --all-features --no-run --timings ${{ matrix.targets }} 2>&1 | tail -40
      - name: touch the crate, build again (dependencies warm, as with the cache)
        run: |
          cd LOSAT && rm -rf target/cargo-timings && touch src/lib.rs src/main.rs
          start=$(date +%s); cargo test --locked --all-features --no-run --timings ${{ matrix.targets }} 2>&1 | tail -20
          echo "warm build seconds $(( $(date +%s) - start ))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ matrix.arm }}
          path: LOSAT/target/cargo-timings/
          retention-days: 3
