name: Windows And macOS Native Certification

run-name: Platform native certification ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact committed and pushed PR 6 candidate SHA
        required: true
        type: string
      resume_run_id:
        description: Optional prior workflow run ID whose verified checkpoints may be reused
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CERT_TOOLCHAIN: 1.92.0

jobs:
  platform-certification:
    name: ${{ matrix.display_name }} (${{ matrix.target_triple }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - platform_id: windows-x64
            display_name: Windows x64
            runner: windows-2025
            target_triple: x86_64-pc-windows-msvc
            executable_suffix: .exe
            oracle_archive: ncbi-blast-2.17.0+-x64-win64.tar.gz
          - platform_id: macos-arm64
            display_name: macOS arm64
            runner: macos-15
            target_triple: aarch64-apple-darwin
            executable_suffix: ""
            oracle_archive: ncbi-blast-2.17.0+-aarch64-macosx.tar.gz
          - platform_id: macos-x64
            display_name: macOS x64
            runner: macos-15-intel
            target_triple: x86_64-apple-darwin
            executable_suffix: ""
            oracle_archive: ncbi-blast-2.17.0+-x64-macosx.tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORM_ID: ${{ matrix.platform_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      EVIDENCE_DIR: ${{ github.workspace }}/platform-certification-evidence/${{ matrix.platform_id }}
      CHECKPOINT_DIR: ${{ github.workspace }}/platform-certification-checkpoint/${{ matrix.platform_id }}
      DOWNLOAD_DIR: ${{ github.workspace }}/platform-certification-downloads/${{ matrix.platform_id }}
      ORACLE_DIR: ${{ github.workspace }}/platform-certification-oracle/${{ matrix.platform_id }}
      ARTIFACT_NAME: platform-native-${{ matrix.platform_id }}
    steps:
      - name: Validate workflow inputs
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be exactly 40 lowercase hex digits" >&2
            exit 1
          fi
          if [[ -n "$RESUME_RUN_ID" && ! "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "resume_run_id must be numeric when supplied" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          ref: ${{ inputs.candidate_sha }}

      - name: Verify exact committed candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Initialize durable in-workspace evidence paths
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET_TRIPLE: ${{ matrix.target_triple }}
        run: |
          mkdir -p "$EVIDENCE_DIR" "$CHECKPOINT_DIR" "$DOWNLOAD_DIR" "$ORACLE_DIR"
          observed_arch="$(uname -m 2>/dev/null || true)"
          printf '%s\n' \
            "candidate_sha=$CANDIDATE_SHA" \
            "platform_id=$PLATFORM_ID" \
            "runner_label=$RUNNER_LABEL" \
            "target_triple=$TARGET_TRIPLE" \
            "run_id=$GITHUB_RUN_ID" \
            "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "runner_os=${RUNNER_OS:-unknown}" \
            "runner_arch=${RUNNER_ARCH:-unknown}" \
            "observed_arch=${observed_arch:-unknown}" \
            "stage=initialized" \
            "status=IN_PROGRESS" \
            "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$EVIDENCE_DIR/workflow-started.txt"

      - name: Record checkpoint recovery stage
        run: |
          printf '%s\n' \
            "stage=checkpoint_recovery" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$EVIDENCE_DIR/workflow-started.txt"

      - name: Recover checkpoint from an earlier attempt of this run
        if: ${{ inputs.resume_run_id == '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.CHECKPOINT_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Recover checkpoint from the requested prior run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.CHECKPOINT_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Preflight controlled historical fixture path
        run: |
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          printf '%s\n' \
            "stage=controlled_path_preflight" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$evidence_log"
          set +e
          python LOSAT/tests/certify_platform_native_v010.py preflight-path \
            --output-dir "$EVIDENCE_DIR" \
            2>&1 | tee -a "$evidence_log"
          preflight_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' \
            "controlled_path_preflight_exit_status=$preflight_status" \
            >> "$evidence_log"
          if [[ $preflight_status -ne 0 ]]; then
            printf '%s\n' \
              "failure_stage=controlled_path_preflight" \
              "failure_status=$preflight_status" \
              >> "$evidence_log"
            exit "$preflight_status"
          fi

      - name: Record frozen Rust toolchain installation stage
        run: |
          printf '%s\n' \
            "stage=toolchain_install" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$EVIDENCE_DIR/workflow-started.txt"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Verify and record frozen Rust toolchain identity
        run: |
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          printf '%s\n' \
            "stage=toolchain_verify" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$evidence_log"
          set +e
          rustc -vV 2>&1 | tee -a "$evidence_log"
          rustc_status=${PIPESTATUS[0]}
          cargo -V 2>&1 | tee -a "$evidence_log"
          cargo_status=${PIPESTATUS[0]}
          rustup show active-toolchain 2>&1 | tee -a "$evidence_log"
          rustup_status=${PIPESTATUS[0]}
          set -e
          rustc_version="$(rustc -V 2>/dev/null || true)"
          cargo_version="$(cargo -V 2>/dev/null || true)"
          if [[ $rustc_status -ne 0 || $cargo_status -ne 0 || $rustup_status -ne 0 ||
                "$rustc_version" != rustc\ 1.92.0\ * ||
                "$cargo_version" != cargo\ 1.92.0\ * ]]; then
            printf '%s\n' \
              "toolchain_identity_status=FAILED" \
              "failure_stage=toolchain_verify" \
              >> "$evidence_log"
            exit 1
          fi
          printf '%s\n' "toolchain_identity_status=VERIFIED" >> "$evidence_log"

      - name: Build exact native release artifact
        run: |
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          printf '%s\n' \
            "stage=build" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "build_command=cd LOSAT && cargo build --release --locked" \
            >> "$evidence_log"
          set +e
          (cd LOSAT && cargo build --release --locked) 2>&1 | tee -a "$evidence_log"
          build_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "build_exit_status=$build_status" >> "$evidence_log"
          if [[ $build_status -ne 0 ]]; then
            printf '%s\n' \
              "failure_stage=build" \
              "failure_status=$build_status" \
              >> "$evidence_log"
            exit "$build_status"
          fi

      - name: Download official NCBI BLAST+ 2.17.0 archive and checksum
        env:
          ARCHIVE_NAME: ${{ matrix.oracle_archive }}
        run: |
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          encoded_name="${ARCHIVE_NAME/+/%2B}"
          base_url="https://ftp.ncbi.nlm.nih.gov/blast/executables/blast%2B/2.17.0"
          archive_url="$base_url/$encoded_name"
          checksum_url="$base_url/$encoded_name.md5"
          printf '%s\n' \
            "stage=oracle_download" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "oracle_archive_name=$ARCHIVE_NAME" \
            "oracle_archive_url=$archive_url" \
            "oracle_checksum_url=$checksum_url" \
            >> "$evidence_log"
          set +e
          curl --fail --location --retry 3 \
            --output "$DOWNLOAD_DIR/$ARCHIVE_NAME" \
            "$archive_url" 2>&1 | tee -a "$evidence_log"
          archive_status=${PIPESTATUS[0]}
          curl --fail --location --retry 3 \
            --output "$DOWNLOAD_DIR/$ARCHIVE_NAME.md5" \
            "$checksum_url" 2>&1 | tee -a "$evidence_log"
          checksum_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' \
            "oracle_archive_download_exit_status=$archive_status" \
            "oracle_checksum_download_exit_status=$checksum_status" \
            >> "$evidence_log"
          if [[ $archive_status -ne 0 || $checksum_status -ne 0 ]]; then
            printf '%s\n' \
              "failure_stage=oracle_download" \
              "failure_status=1" \
              >> "$evidence_log"
            exit 1
          fi

      - name: Verify pinned NCBI provenance before extraction
        env:
          ARCHIVE_NAME: ${{ matrix.oracle_archive }}
        run: |
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          printf '%s\n' \
            "stage=oracle_verify" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$evidence_log"
          set +e
          python LOSAT/tests/certify_platform_native_v010.py verify-archive \
            --platform-id "$PLATFORM_ID" \
            --archive "$DOWNLOAD_DIR/$ARCHIVE_NAME" \
            --checksum "$DOWNLOAD_DIR/$ARCHIVE_NAME.md5" \
            2>&1 | tee -a "$evidence_log"
          verify_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "oracle_verify_exit_status=$verify_status" >> "$evidence_log"
          if [[ $verify_status -ne 0 ]]; then
            printf '%s\n' \
              "failure_stage=oracle_verify" \
              "failure_status=$verify_status" \
              >> "$evidence_log"
            exit "$verify_status"
          fi

      - name: Extract the verified official oracle archive
        env:
          ARCHIVE_NAME: ${{ matrix.oracle_archive }}
        run: |
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          printf '%s\n' \
            "stage=oracle_extract" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$evidence_log"
          set +e
          python LOSAT/tests/certify_platform_native_v010.py \
            extract-verified-archive \
            --platform-id "$PLATFORM_ID" \
            --archive "$DOWNLOAD_DIR/$ARCHIVE_NAME" \
            --checksum "$DOWNLOAD_DIR/$ARCHIVE_NAME.md5" \
            --destination "$ORACLE_DIR" \
            2>&1 | tee -a "$evidence_log"
          extract_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "oracle_extract_exit_status=$extract_status" >> "$evidence_log"
          if [[ $extract_status -ne 0 ]]; then
            printf '%s\n' \
              "failure_stage=oracle_extract" \
              "failure_status=$extract_status" \
              >> "$evidence_log"
            exit "$extract_status"
          fi

      - name: Run or resume exact 61-execution platform certification
        env:
          ARCHIVE_NAME: ${{ matrix.oracle_archive }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          printf '%s\n' \
            "stage=platform_certification" \
            "stage_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$evidence_log"
          native_bin="$GITHUB_WORKSPACE/LOSAT/target/release/LOSAT$EXECUTABLE_SUFFIX"
          oracle_bin="$ORACLE_DIR/ncbi-blast-2.17.0+/bin"
          resume_args=()
          if [[ -f "$CHECKPOINT_DIR/identity.json" ]]; then
            resume_args=(--resume-dir "$CHECKPOINT_DIR")
          fi
          # NCBI reference:
          # ncbi-blast/c++/src/algo/blast/format/blast_format.cpp:770-832
          # Existing program authorities build and classify the raw outputs;
          # the platform driver only invokes them and checks PR 5 SHA-256 values.
          set +e
          python LOSAT/tests/certify_platform_native_v010.py certify \
            --expected-sha "$CANDIDATE_SHA" \
            --platform-id "$PLATFORM_ID" \
            --output-dir "$EVIDENCE_DIR" \
            "${resume_args[@]}" \
            --native-bin "$native_bin" \
            --oracle-archive "$DOWNLOAD_DIR/$ARCHIVE_NAME" \
            --oracle-checksum "$DOWNLOAD_DIR/$ARCHIVE_NAME.md5" \
            --blastn-oracle "$oracle_bin/blastn$EXECUTABLE_SUFFIX" \
            --blastp-oracle "$oracle_bin/blastp$EXECUTABLE_SUFFIX" \
            --tblastx-oracle "$oracle_bin/tblastx$EXECUTABLE_SUFFIX"
          certification_status=$?
          set -e
          if [[ $certification_status -ne 0 ]]; then
            printf '%s\n' \
              "failure_stage=platform_certification" \
              "failure_status=$certification_status" \
              >> "$evidence_log"
            exit "$certification_status"
          fi

      - name: Finalize workflow status evidence
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            exit 0
          fi
          mkdir -p "$EVIDENCE_DIR"
          evidence_log="$EVIDENCE_DIR/workflow-started.txt"
          if [[ ! -s "$evidence_log" ]]; then
            printf '%s\n' \
              "candidate_sha=$CANDIDATE_SHA" \
              "platform_id=$PLATFORM_ID" \
              "run_id=$GITHUB_RUN_ID" \
              "run_attempt=$GITHUB_RUN_ATTEMPT" \
              "runner_os=${RUNNER_OS:-unknown}" \
              "runner_arch=${RUNNER_ARCH:-unknown}" \
              "stage=pre_evidence_setup" \
              > "$evidence_log"
          fi
          current_stage="$(awk -F= '$1 == "stage" { value = $2 } END { print value }' "$evidence_log")"
          printf '%s\n' \
            "final_stage=${current_stage:-unknown}" \
            "final_job_status=$JOB_STATUS" \
            "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "failure_stage=${current_stage:-unknown}" \
            "failure_status=$JOB_STATUS" \
            >> "$evidence_log"

      - name: Upload incremental platform evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30
