name: Benchmark plot rendering

on:
  push:
    paths:
      - ".github/workflows/benchmark-plots.yml"
      - "benchmarks/v0.1.0/**"
      - "scripts/render_benchmark_plots.py"
      - "tests/test_render_benchmark_plots.py"
  pull_request:
    paths:
      - ".github/workflows/benchmark-plots.yml"
      - "benchmarks/v0.1.0/**"
      - "scripts/render_benchmark_plots.py"
      - "tests/test_render_benchmark_plots.py"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install plotting dependency
        run: python -m pip install matplotlib==3.10.3 numpy==2.2.5
      # NCBI schema reference: ncbi-blast/c++/src/objtools/align_format/format_flags.cpp:38-40,109-116.
      # This job transforms the committed normalized `length` and `pident` data only.
      - name: Test data-only renderer
        run: |
          export MPLCONFIGDIR="$RUNNER_TEMP/matplotlib"
          python -m unittest tests/test_render_benchmark_plots.py
      - name: Render committed snapshot
        run: |
          export MPLCONFIGDIR="$RUNNER_TEMP/matplotlib"
          python scripts/render_benchmark_plots.py \
            --snapshot benchmarks/v0.1.0 \
            --output "$RUNNER_TEMP/benchmark-plots"
      - name: Verify deterministic plot data
        run: |
          cmp benchmarks/v0.1.0/plot_data.json "$RUNNER_TEMP/benchmark-plots/plot_data.json"
          test -s "$RUNNER_TEMP/benchmark-plots/hit_distribution.png"
          test -s "$RUNNER_TEMP/benchmark-plots/execution_time.png"
